<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d2b">
<meta name="description" content="Starry Dreamland 星夢樂園：星座、月相、引力與星芽探索互動遊戲。">
<title>Starry Dreamland｜星夢樂園</title>
<style>
:root{--bg:#090d2b;--panel:#151a3b;--violet:#8a75c6;--lav:#c0adeb;--gold:#efd49a;--muted:#b9b8d2;--line:#b49bdd66;--pink:#e9b7dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f2efff;font-family:system-ui,"Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 50% -10%,#51447e,#1a2049 42%,#090d2b 85%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,#fff 45%,transparent 56%),radial-gradient(1px 1px at 22% 72%,#f4dfb2 45%,transparent 56%),radial-gradient(2px 2px at 68% 24%,#fff 45%,transparent 56%),radial-gradient(1px 1px at 82% 66%,#c8b8ff 45%,transparent 56%),radial-gradient(1px 1px at 42% 42%,#fff 45%,transparent 56%);background-size:480px 420px;animation:drift 28s linear infinite}@keyframes drift{to{transform:translateY(-65px)}}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px clamp(12px,4vw,44px);background:#090d2beF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;min-width:210px}.mark{height:40px;width:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:23px;border:1px solid #d9bb7d88;background:#171b43;box-shadow:0 0 22px #c8a66a33}.brand b{display:block;font:600 19px Georgia,serif;color:var(--gold)}.brand small{display:block;font-size:9px;letter-spacing:3px;color:#c8b9ea}.nav{display:flex;gap:5px;justify-content:center;flex:1}.nav button,.ghost{border:1px solid transparent;background:transparent;color:var(--muted);padding:8px 12px;border-radius:99px}.nav button.active,.nav button:hover,.ghost:hover{background:#8e7cc322;border-color:var(--line);color:var(--gold)}.pill{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:#151c42;font-size:13px}.pill b{color:var(--gold)}.wrap{width:min(1160px,calc(100% - 28px));margin:auto;padding:20px 0 60px}.hero{text-align:center;padding:34px 0 25px}.eyebrow{font-size:11px;letter-spacing:4px;color:var(--lav)}h1{font:600 clamp(31px,5vw,58px) Georgia,"Noto Serif TC",serif;color:var(--gold);margin:12px 0;text-shadow:0 0 30px #d6b87966}.hero p{max-width:660px;margin:auto;color:var(--muted);line-height:1.9}.btn{border:0;border-radius:99px;padding:11px 22px;background:linear-gradient(120deg,#f3dfa9,#c89955);color:#17132a;font-weight:800;box-shadow:0 8px 24px #d9ae6333}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.alt{background:#282957;color:#eee;border:1px solid var(--line);box-shadow:none}.btn.sm{padding:8px 15px;font-size:13px}.panel,.card{border:1px solid var(--line);border-radius:21px;padding:20px;background:linear-gradient(145deg,#22234fdd,#0e1533ee);box-shadow:0 12px 34px #0004}.plaza{position:relative;min-height:350px;border:1px solid var(--line);border-radius:27px;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#9273c777,#463e7b55 28%,transparent 63%),linear-gradient(#171c47,#25224b 62%,#111938);box-shadow:0 20px 80px #0005}.plaza:before{content:"";position:absolute;width:560px;height:220px;left:50%;bottom:-125px;transform:translateX(-50%);border-radius:50%;border:2px solid #e3c889aa;box-shadow:0 0 0 16px #b59bdf18,0 0 0 36px #d4bb7b22,0 0 50px #d6ba8066}.plaza:after{content:"✦";position:absolute;left:50%;bottom:45px;transform:translateX(-50%);font-size:72px;color:var(--gold);text-shadow:0 0 15px #ffe6a0,0 0 55px #b797ec;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.5);transform:translateX(-50%) scale(1.08)}}.moon{position:absolute;width:145px;height:145px;right:9%;top:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4d9,#b5a9d7 62%,#665b94);box-shadow:0 0 75px #d9c6ff88}.castle{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:70px;filter:drop-shadow(0 0 22px #c8a7ff)}.island{position:absolute;width:175px;height:65px;border-radius:50%;background:linear-gradient(#7c6eab,#302a5d);border:1px solid #d4c1ff88;box-shadow:0 24px 35px #0008,0 0 22px #c5a6ff55}.island.left{left:4%;top:155px;transform:rotate(-7deg)}.island.right{right:4%;top:178px;transform:rotate(8deg)}.portals{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;gap:clamp(8px,3vw,30px);width:min(760px,96%);justify-content:center}.portal{width:145px;min-height:110px;border:1px solid #f0d59a88;border-radius:18px;background:linear-gradient(160deg,#55427ddd,#161b43ee);color:#f2efff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 0 22px #ac8be455;transition:.2s}.portal:hover{transform:translateY(-8px);box-shadow:0 0 35px #e7ca8f99}.portal i{font-style:normal;font-size:32px;color:var(--gold);text-shadow:0 0 14px #f4d99b}.portal small{font-size:10px;color:#c6bddb}.locked{position:absolute;right:16px;top:16px;padding:8px 12px;border:1px dashed #e8d5a988;border-radius:12px;color:#e8d5a9;background:#191c41aa;font-size:12px}.caption{position:absolute;left:18px;bottom:16px;color:#c9c2e0;font-size:11px;letter-spacing:1px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 14px}.head h2{margin:0;color:var(--gold);font:600 24px Georgia,"Noto Serif TC",serif}.head p{margin:5px 0 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.art{height:105px;border-radius:14px;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle,#9d84c755,#292652 65%,#101635);border:1px solid #a994dc33}.card h3{margin:12px 0 7px;color:var(--gold)}.card p{font-size:13px;color:var(--muted);line-height:1.7;min-height:64px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{flex:1;min-width:140px;padding:13px 17px;background:#171d40cc;border:1px solid var(--line);border-radius:15px}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:23px;margin-top:4px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--gold);background:#20244e;font-size:13px}.board{margin:18px auto;max-width:760px;min-height:270px;border:1px solid #b29ada55;border-radius:18px;background:radial-gradient(ellipse,#43386e,#111735 70%);padding:15px;position:relative;overflow:hidden}.nodes{position:relative;height:330px}.node{position:absolute;width:43px;height:43px;min-height:43px;border:1px solid #d4c09a66;border-radius:50%;background:#252552;color:var(--gold);font-size:22px;transform:translate(-50%,-50%);box-shadow:0 0 15px #ad8ddb22}.node.done{background:#5d4e83;box-shadow:0 0 24px #edd39b99;color:#fff}.node.next{animation:glow 1s infinite alternate;border-color:var(--gold)}@keyframes glow{to{box-shadow:0 0 30px #ffe0a4;transform:translate(-50%,-50%) scale(1.08)}}.progress{height:8px;background:#35365d;border-radius:8px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#9c84df,#f0d69a);width:0}.moon-track{height:180px;position:relative;margin:18px 0;border-radius:16px;background:linear-gradient(#161a43,#28214e);overflow:hidden;border:1px solid #9d8cce55}.moon-track:before{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:2px solid #f0d69a;box-shadow:0 0 16px #f0d69a}.hit-zone{position:absolute;left:calc(50% - 64px);width:128px;top:0;bottom:0;border-left:1px solid #ffe2a8aa;border-right:1px solid #ffe2a8aa;background:#efd49a18;box-shadow:0 0 28px #f3d49a22 inset}.moon-token{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:43px;filter:drop-shadow(0 0 12px #f5d49a)}.maze{display:grid;grid-template-columns:repeat(8,minmax(25px,47px));gap:4px;justify-content:center;margin:15px auto}.cell{aspect-ratio:1;border-radius:7px;background:#2b315b;border:1px solid #59527b;display:grid;place-items:center;font-size:18px}.cell.wall{background:#090f2c;border-color:#171d3f}.cell.key{background:#59436e;color:#ffe6a2;box-shadow:0 0 15px #e8c88566}.cell.exit{background:#274c59;color:#a9ffe0}.cell.player{background:#7861a9;box-shadow:0 0 18px #c9b1ff;color:white}.dpad{display:grid;grid-template-columns:repeat(3,42px);gap:5px;justify-content:center;margin:12px}.dpad button{height:38px;border-radius:9px;border:1px solid var(--line);background:#242950;color:var(--gold)}.child{padding:20px;border:1px solid #e8b9e377;border-radius:22px;background:linear-gradient(120deg,#4a376d,#172044 65%,#3d315f);display:flex;gap:17px;align-items:center}.child .big{font-size:52px}.child h2{margin:0;color:#f5d7ed}.child p{margin:5px 0;color:#dbd2e9;font-size:13px;line-height:1.7}.memory{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:10px;justify-content:center;margin:18px}.memory button{height:90px;border-radius:14px;border:1px solid var(--line);background:#24234d;color:var(--gold);font-size:30px}.memory button.open,.memory button.matched{background:#57477e;box-shadow:0 0 22px #e9c98d66}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #a994dc33;text-align:left;font-size:13px}.table th{color:var(--gold)}.footer{text-align:center;color:#8e91b1;font-size:11px;padding:28px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#181d43;border:1px solid var(--gold);color:var(--gold);padding:10px 17px;border-radius:99px;opacity:0;pointer-events:none;z-index:30;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}
@media(max-width:760px){.top{flex-wrap:wrap}.brand{min-width:unset;flex:1}.nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto}.nav button{white-space:nowrap;font-size:12px;padding:8px 10px}.pill{font-size:11px}.wrap{width:calc(100% - 20px);padding-top:12px}.hero{padding:25px 0 18px}.plaza{min-height:405px}.moon{width:105px;height:105px;right:4%;top:24px}.castle{font-size:54px;top:30px}.portals{top:58%;flex-wrap:wrap;width:94%;gap:7px}.portal{width:calc(33.33% - 6px);min-width:88px;min-height:100px}.portal i{font-size:25px}.portal b{font-size:12px}.portal small{font-size:9px}.plaza:before{width:360px}.plaza:after{bottom:36px;font-size:58px}.island{width:100px;height:42px}.island.left{top:180px}.island.right{top:215px}.cards{grid-template-columns:1fr}.card p{min-height:unset}.stats{gap:7px}.stat{min-width:100px;padding:10px}.stat b{font-size:19px}.child{align-items:flex-start}.table th,.table td{font-size:11px;padding:7px 4px}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark">✦</div><div><b>星夢樂園</b><small>STARRY DREAMLAND</small></div></div><nav class="nav"><button data-page="home" class="active">星夢廣場</button><button data-page="children">星芽探索區</button><button data-page="leaderboard">排行榜</button><button data-page="history">遊玩紀錄</button></nav><div class="pill hidden" id="pill"><b id="pname">旅人</b>　<span id="points">0 ✦</span>　<button class="ghost" id="logout">登出</button></div></header>
<main class="wrap" id="app"></main><div class="toast" id="toast"></div>
<script>
(function(){
const STORE="starryDreamland.githubPages.demo";let state=read(),clock=null,frame=null,active=null;
function read(){try{return Object.assign({player:null,players:[],records:[]},JSON.parse(localStorage.getItem(STORE)||"{}"))}catch(e){return {player:null,players:[],records:[]}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function me(){return state.players.find(p=>p.id===state.player)}
function total(){return me()?me().points:0}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900)}
function header(){const p=me();document.getElementById("pill").classList.toggle("hidden",!p);if(p){document.getElementById("pname").textContent=p.name;document.getElementById("points").textContent=p.points+" ✦"}}
function shell(s){document.getElementById("app").innerHTML=s}
function nav(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function stop(){if(clock){clearInterval(clock);clock=null}if(frame){cancelAnimationFrame(frame);frame=null}if(active&&active.cleanup)active.cleanup()}
function login(){nav("");header();shell('<section class="hero"><div class="eyebrow">A JOURNEY THROUGH THE STARS</div><h1>星夢樂園</h1><p>在星空之中，展開一場夢幻的遊戲之旅。</p></section><div class="panel" style="max-width:520px;margin:auto;text-align:center"><div style="font-size:58px;color:var(--gold)">✦</div><h2 style="font:600 28px Georgia,serif;color:var(--gold)">歡迎來到星夢樂園</h2><p style="color:var(--muted)">輸入旅人暱稱，開始探索星空。</p><input id="nickname" maxlength="16" placeholder="輸入旅人暱稱" style="width:100%;padding:14px;border-radius:14px;background:#0d1432;border:1px solid var(--line);color:white;margin:12px 0 18px"><button class="btn" id="enter">進入星夢樂園</button><p style="font-size:11px;color:#9999bc;margin-top:18px">展示模式：資料保存在目前瀏覽器，不需註冊或輸入真實密碼。</p></div>')}
function home(){nav("home");header();shell('<section class="hero"><div class="eyebrow">A JOURNEY THROUGH THE STARS</div><h1>在星空之中，展開夢幻旅程</h1><p>穿越漂浮島嶼，尋找星辰的秘密。完成挑戰、累積星塵，讓你的星空旅程留下紀錄。</p></section><section class="plaza"><div class="moon"></div><div class="castle">🏰</div><div class="island left"></div><div class="island right"></div><div class="locked">✧ 星際競技館<br><small>尚未開放 · COMING SOON</small></div><div class="portals"><button class="portal" data-game="constellation"><i>✧</i><b>星座校準</b><small>連接星辰・45 秒</small></button><button class="portal" data-game="moon"><i>☾</i><b>月相共鳴</b><small>節奏挑戰・10 拍</small></button><button class="portal" data-game="maze"><i>◈</i><b>引力迷航</b><small>收集星塵・45 秒</small></button></div><div class="caption">✦ CENTRAL STAR PLAZA　／　星空導覽視角</div></section><div class="head"><div><h2>今日星空冒險</h2><p>選擇一座設施，開始你的星塵挑戰。</p></div></div><section class="cards"><article class="card"><div class="art">✧</div><h3>星座校準</h3><p>依照星空指引，連接正確星點。小心干擾星，完成星座校準。</p><button class="btn sm" data-game="constellation">進入遊戲</button></article><article class="card"><div class="art">☾</div><h3>月相共鳴</h3><p>觀察月亮通過中央光圈的時機，按下共鳴鍵，累積連續命中。</p><button class="btn sm" data-game="moon">進入遊戲</button></article><article class="card"><div class="art">◈</div><h3>引力迷航</h3><p>控制發光星球穿越迷宮，收集兩枚星塵碎片，解鎖終點星門。</p><button class="btn sm" data-game="maze">進入遊戲</button></article></section><div class="head"><div><h2>旅人資料</h2><p>展示版資料僅保存在目前瀏覽器。</p></div></div><div class="stats"><div class="stat"><small>玩家暱稱</small><b>'+esc(me().name)+'</b></div><div class="stat"><small>累積星塵</small><b>'+total()+' ✦</b></div><div class="stat"><small>挑戰次數</small><b>'+state.records.filter(r=>r.uid===me().id).length+'</b></div></div><div class="footer">Starry Dreamland · 星夢樂園　｜　星際競技館敬請期待</div>')}
function instructions(id){const d={constellation:["星座校準","45 秒內依序連接 8 顆目標星。星點會提示下一個位置；點錯會扣分。","✧"],moon:["月相共鳴","月亮沿著星軌移動，進入中央金色提示區時按下空白鍵或共鳴按鈕。","☾"],maze:["引力迷航","使用方向鍵或畫面按鈕移動光球，收集兩枚星塵碎片後抵達出口。","◈"]}[id];nav("");shell('<section class="hero"><div class="eyebrow">MINI GAME CHALLENGE</div><h1>'+d[0]+'</h1><p>'+d[1]+'</p></section><div class="panel" style="max-width:700px;margin:auto;text-align:center"><div style="font-size:65px;color:var(--gold)">'+d[2]+'</div><p style="color:var(--muted);line-height:1.8">完成挑戰可依分數獲得星塵；時間結束可獲得基本分數獎勵。提前離開不會獲得星塵。</p><button class="btn" data-start="'+id+'">開始挑戰</button> <button class="btn alt" data-page="home">返回星夢廣場</button></div>')}
function result(score,status,id){stop();score=Math.max(0,Math.min(100,Math.round(score)));const reward=status==="abandoned"?0:Math.floor(score/10)+(status==="completed"?5:0);const p=me();if(reward&&p)p.points+=reward;state.records.push({uid:p.id,name:p.name,game:id,score,status,reward,time:Date.now()});save();header();shell('<section class="hero"><div class="eyebrow">YOUR STAR JOURNEY</div><h1>挑戰結果</h1><p>'+({completed:"太棒了！你完成了本次挑戰。",timed_out:"時間到了，星空仍記住你的努力。",abandoned:"已提前離開，本次不發放星塵。"}[status])+'</p></section><div class="panel" style="max-width:650px;margin:auto;text-align:center"><div style="font-size:54px;color:var(--gold)">✦</div><div class="stats"><div class="stat"><small>本次分數</small><b>'+score+'</b></div><div class="stat"><small>獲得星塵</small><b>+'+reward+' ✦</b></div><div class="stat"><small>挑戰狀態</small><b style="font-size:17px">'+({completed:"完成",timed_out:"時間到",abandoned:"提前退出"}[status])+'</b></div></div><p style="color:var(--muted)">目前累積星塵：'+total()+' ✦</p><button class="btn" data-page="home">返回星夢廣場</button> <button class="btn alt" data-game="'+id+'">再玩一次</button></div>')}
function startConstellation(){let pts=[[20,28],[45,15],[72,25],[84,53],[64,78],[36,82],[15,63],[40,49],[67,45],[12,40],[51,58],[78,82]],order=0,score=100,sec=45,done=[];active={id:"constellation"};shell('<div class="panel"><div class="head"><div><h2>✧ 星座校準</h2><p>按照閃爍指引連接 8 顆目標星。</p></div><div class="meta"><span class="chip" id="timer">45 秒</span><button class="ghost" data-quit>退出</button></div></div><div class="progress"><i id="progress"></i></div><div class="board"><svg id="lines" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"></svg><div class="nodes" id="nodes"></div></div><div class="head"><span class="chip" id="hint">星空指引：尋找第 1 顆星 ✧</span><b id="score" style="color:var(--gold)">分數 100</b></div></div>');const host=document.getElementById("nodes");pts.forEach((pt,i)=>{const b=document.createElement("button");b.className="node";b.textContent=i<8?"✦":"✧";b.style.left=pt[0]+"%";b.style.top=pt[1]+"%";if(i===0)b.classList.add("next");b.onclick=()=>{if(done.includes(i))return;if(i===order&&i<8){done.push(i);order++;b.classList.add("done");b.classList.remove("next");if(order<8)host.children[order].classList.add("next");document.getElementById("hint").textContent=order===8?"星座完成！":"星空指引：尋找第 "+(order+1)+" 顆星 ✧";document.getElementById("progress").style.width=(order/8*100)+"%";document.getElementById("lines").innerHTML=done.slice(1).map((n,k)=>'<line x1="'+pts[done[k]][0]+'" y1="'+pts[done[k]][1]+'" x2="'+pts[n][0]+'" y2="'+pts[n][1]+'" stroke="#f4d69c" stroke-width="1.3"/>').join("");if(order===8)result(Math.min(100,score+Math.max(0,sec-20)), "completed","constellation")}else{score=Math.max(0,score-5);b.style.opacity=".35";document.getElementById("score").textContent="分數 "+score;say("這不是目標星，再試一次！")}};host.appendChild(b)});clock=setInterval(()=>{sec--;const t=document.getElementById("timer");if(t)t.textContent=sec+" 秒";if(sec<=0)result(score,"timed_out","constellation")},1000)}
function startMoon(){let index=0,combo=0,score=0,sec=0,period=1400,start=Date.now()+1800,beats=10,judged=false;active={id:"moon"};shell('<div class="panel"><div class="head"><div><h2>☾ 月相共鳴</h2><p>月亮進入中央金色提示區時按下共鳴。</p></div><div class="meta"><span class="chip" id="beat">準備中</span><span class="chip" id="combo">COMBO 0</span><button class="ghost" data-quit>退出</button></div></div><div class="moon-track"><div class="hit-zone"></div><div class="moon-token" id="token">☾</div></div><div class="head"><span class="chip" id="feedback">等待月光靠近</span><b id="mscore" style="color:var(--gold)">分數 0</b></div><div class="progress"><i id="mprogress"></i></div><div style="text-align:center;margin-top:16px"><button class="btn" id="hit">☾ 共鳴</button></div></div>');function tick(){if(index>=beats)return;const now=Date.now(),target=start+index*period,diff=now-target,pct=Math.max(0,Math.min(100,(diff+650)/1300*100)),token=document.getElementById("token");if(!token)return;token.style.left=pct+"%";document.getElementById("beat").textContent="第 "+(index+1)+" / "+beats+" 拍";document.getElementById("mprogress").style.width=((index+pct/100)/beats*100)+"%";if(Math.abs(diff)<360)document.getElementById("feedback").textContent="現在可以按下共鳴！";else if(diff< -360)document.getElementById("feedback").textContent="準備迎接月光…";else document.getElementById("feedback").textContent="月光通過中央光圈";if(diff>520&&!judged){judged=true;combo=0;document.getElementById("combo").textContent="COMBO 0";document.getElementById("feedback").textContent="錯過節拍";next()}frame=requestAnimationFrame(tick)}function next(){index++;judged=false;if(index>=beats)setTimeout(()=>result(score,"completed","moon"),250)}function hit(){if(index>=beats||Date.now()<start-500||judged)return;const diff=Math.abs(Date.now()-(start+index*period));if(diff<=360){combo++;score+=10;document.getElementById("combo").textContent="COMBO "+combo;document.getElementById("mscore").textContent="分數 "+score;document.getElementById("feedback").textContent=diff<170?"完美共鳴！✦":"共鳴成功！"}else{combo=0;document.getElementById("combo").textContent="COMBO 0";document.getElementById("feedback").textContent="還沒到共鳴時刻"}judged=true;next()}document.getElementById("hit").onclick=hit;const key=e=>{if(e.code==="Space"){e.preventDefault();hit()}};window.addEventListener("keydown",key);active.cleanup=()=>window.removeEventListener("keydown",key);frame=requestAnimationFrame(tick)}
const map=["########","#S..#..#","##.#.#.#","#...#K.#","#.###..#","#K....E#","#..##..#","########"];
function startMaze(){let x=1,y=1,keys=0,steps=0,score=100,sec=45;active={id:"maze"};shell('<div class="panel"><div class="head"><div><h2>◈ 引力迷航</h2><p>收集兩枚星塵碎片，再抵達出口星門。</p></div><div class="meta"><span id="mtimer" class="chip">45 秒</span><span id="mkeys" class="chip">星塵 0 / 2</span><button class="ghost" data-quit>退出</button></div></div><div class="maze" id="maze"></div><div class="dpad"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div class="head"><span class="chip" id="mhint">尋找第一枚星塵</span><b id="steps" style="color:var(--gold)">步數 0</b></div></div>');function draw(){const el=document.getElementById("maze");if(!el)return;el.innerHTML="";map.forEach((row,yy)=>row.split("").forEach((ch,xx)=>{const c=document.createElement("div");c.className="cell";if(ch==="#")c.classList.add("wall");if(ch==="E")c.classList.add("exit");if(ch==="K"&&!((xx===1&&yy===5&&(keys&1))||(xx===5&&yy===3&&(keys&2))))c.classList.add("key");if(x===xx&&y===yy){c.classList.add("player");c.textContent="🔮"}else if(ch==="K"&&c.classList.contains("key"))c.textContent="✦";else if(ch==="E")c.textContent="門";el.appendChild(c)}))}function move(dx,dy){const nx=x+dx,ny=y+dy;if(map[ny][nx]==="#")return;x=nx;y=ny;steps++;const ch=map[y][x];if(ch==="K"){if(x===1&&y===5)keys|=1;if(x===5&&y===3)keys|=2;say("收集到星塵碎片！")}document.getElementById("mkeys").textContent="星塵 "+(Number(Boolean(keys&1))+Number(Boolean(keys&2)))+" / 2";document.getElementById("steps").textContent="步數 "+steps;if(ch==="E"){if(keys===3){result(Math.max(0,Math.min(100,100-(steps-24)*2)), "completed","maze");return}else document.getElementById("mhint").textContent="還需要收集兩枚星塵碎片！"}draw()}const key=e=>{const d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(d[0],d[1])}};window.addEventListener("keydown",key);active.cleanup=()=>window.removeEventListener("keydown",key);document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];move(d[0],d[1])});draw();clock=setInterval(()=>{sec--;const t=document.getElementById("mtimer");if(t)t.textContent=sec+" 秒";if(sec<=0)result(Math.max(0,score-steps),"timed_out","maze")},1000)}
function start(id){stop();instructions(id);document.querySelector('[data-start]').onclick=()=>{if(id==="constellation")startConstellation();if(id==="moon")startMoon();if(id==="maze")startMaze()}}
function finishAbandon(){if(active)result(0,"abandoned",active.id)}
function children(){nav("children");shell('<section class="hero"><div class="eyebrow">LITTLE STARLAND</div><h1>星芽探索區</h1><p>放慢腳步，和星星交朋友。這裡沒有時間壓力，適合練習與探索。</p></section><div class="child"><div class="big">🌟</div><div><h2>小小星空探險家</h2><p>用簡單任務認識星座、觀察圖案。練習模式不列入競技排行榜。</p></div></div><section class="cards" style="margin-top:16px"><article class="card"><div class="art">⭐</div><h3>星星連連看</h3><p>依照提示順序連接 6 顆星星，不限時間，慢慢完成自己的星座。</p><button class="btn sm" data-child="connect">開始探索</button></article><article class="card"><div class="art">🌙</div><h3>星星記憶</h3><p>翻開卡片，找出相同的星月圖案。完成 3 組配對即可過關。</p><button class="btn sm" data-child="memory">開始探索</button></article></section>')}
function childConnect(){let order=0,pts=[[18,28],[40,14],[67,24],[83,51],[63,79],[30,72]],done=[];shell('<div class="panel"><div class="head"><div><h2>🌟 星星連連看</h2><p>依序點亮閃爍的星星，沒有時間限制喔！</p></div><button class="ghost" data-page="children">返回</button></div><div class="board"><svg id="clines" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"></svg><div class="nodes" id="cnodes"></div></div><div class="head"><span class="chip" id="cstep">第 1 / 6 顆</span><button class="btn" id="cf" disabled>完成星座</button></div></div>');pts.forEach((pt,n)=>{const b=document.createElement("button");b.className="node";b.textContent="✦";b.style.left=pt[0]+"%";b.style.top=pt[1]+"%";if(n===0)b.classList.add("next");b.onclick=()=>{if(n!==order){say("找找正在閃爍的星星喔！");return}done.push(n);b.classList.add("done");b.classList.remove("next");order++;if(order<6)document.getElementById("cnodes").children[order].classList.add("next");document.getElementById("cstep").textContent="第 "+Math.min(order+1,6)+" / 6 顆";document.getElementById("clines").innerHTML=done.slice(1).map((v,k)=>'<line x1="'+pts[done[k]][0]+'" y1="'+pts[done[k]][1]+'" x2="'+pts[v][0]+'" y2="'+pts[v][1]+'" stroke="#f4d69c" stroke-width="1.5"/>').join("");if(order===6)document.getElementById("cf").disabled=false};document.getElementById("cnodes").appendChild(b)});document.getElementById("cf").onclick=()=>result(100,"completed","child-connect")}
function childMemory(){let faces=["✦","☾","✧"],cards=faces.concat(faces).sort(()=>Math.random()-.5),open=[],matched=0,moves=0;shell('<div class="panel"><div class="head"><div><h2>🌙 星星記憶</h2><p>翻開兩張卡片，找出相同圖案。</p></div><button class="ghost" data-page="children">返回</button></div><div class="meta"><span class="chip" id="mm">已配對 0 / 3</span><span class="chip" id="mv">翻牌 0 次</span></div><div class="memory" id="memory"></div></div>');cards.forEach((face,i)=>{const b=document.createElement("button");b.textContent="?";b.onclick=()=>{if(b.classList.contains("matched")||open.includes(i)||open.length===2)return;moves++;b.textContent=face;b.classList.add("open");open.push(i);document.getElementById("mv").textContent="翻牌 "+moves+" 次";if(open.length===2){const a=open[0],c=open[1];if(cards[a]===cards[c]){setTimeout(()=>{document.querySelectorAll(".memory button")[a].classList.replace("open","matched");document.querySelectorAll(".memory button")[c].classList.replace("open","matched");open=[];matched++;document.getElementById("mm").textContent="已配對 "+matched+" / 3";if(matched===3)result(Math.max(60,100-moves*2),"completed","child-memory")},250)}else setTimeout(()=>{document.querySelectorAll(".memory button")[a].textContent="?";document.querySelectorAll(".memory button")[c].textContent="?";document.querySelectorAll(".memory button")[a].classList.remove("open");document.querySelectorAll(".memory button")[c].classList.remove("open");open=[]},650)}};document.getElementById("memory").appendChild(b)})}
function rank(){nav("leaderboard");let games=["constellation","moon","maze"],labels={constellation:"星座校準",moon:"月相共鳴",maze:"引力迷航"};let rows=state.players.map(p=>{let best={};games.forEach(g=>best[g]=Math.max(0,...state.records.filter(r=>r.uid===p.id&&r.game===g&&r.status!=="abandoned").map(r=>r.score)));return {name:p.name,total:games.reduce((s,g)=>s+best[g],0),best}}).sort((a,b)=>b.total-a.total);shell('<section class="hero"><div class="eyebrow">STAR DUST RANKING</div><h1>星塵排行榜</h1><p>目前為本機展示排行榜；全體玩家共用排行榜將於雲端版本加入。</p></section><div class="panel"><h3 style="color:var(--gold)">總排行榜</h3><table class="table"><thead><tr><th>排名</th><th>旅人</th><th>總分</th></tr></thead><tbody>'+ (rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.total+'</td></tr>').join("")||'<tr><td colspan="3">目前還沒有排行資料</td></tr>')+'</tbody></table></div><section class="cards" style="margin-top:15px">'+games.map(g=>{let rr=state.players.map(p=>({name:p.name,score:Math.max(0,...state.records.filter(r=>r.uid===p.id&&r.game===g&&r.status!=="abandoned").map(r=>r.score))})).sort((a,b)=>b.score-a.score).slice(0,5);return '<article class="card"><h3>'+labels[g]+'</h3><table class="table"><tbody>'+rr.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.score+'</td></tr>').join("")+'</tbody></table></article>'}).join("")+'</section>')}
function history(){nav("history");let rs=state.records.filter(r=>r.uid===me().id).slice().reverse(),labels={constellation:"星座校準",moon:"月相共鳴",maze:"引力迷航","child-connect":"星星連連看","child-memory":"星星記憶"};shell('<section class="hero"><div class="eyebrow">MY STAR JOURNEY</div><h1>我的遊玩紀錄</h1><p>每一趟冒險都值得被記住。</p></section><div class="panel"><table class="table"><thead><tr><th>遊戲</th><th>分數</th><th>狀態</th><th>星塵</th></tr></thead><tbody>'+(rs.map(r=>'<tr><td>'+(labels[r.game]||r.game)+'</td><td>'+r.score+'</td><td>'+({completed:"完成",timed_out:"時間到",abandoned:"提前退出"}[r.status])+'</td><td>+'+r.reward+' ✦</td></tr>').join("")||'<tr><td colspan="4">目前還沒有遊玩紀錄。</td></tr>')+'</tbody></table></div>')}
function render(){if(!me()){login();return}home()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page){if(b.dataset.page==="home")home();if(b.dataset.page==="children")children();if(b.dataset.page==="leaderboard")rank();if(b.dataset.page==="history")history();return}if(b.dataset.game){start(b.dataset.game);return}if(b.dataset.start){start(b.dataset.start);return}if(b.dataset.quit){result(0,"abandoned",active?active.id:"unknown");return}if(b.dataset.child){if(b.dataset.child==="connect")childConnect();else childMemory();return}if(b.id==="enter"){let name=(document.getElementById("nickname").value||"星空旅人").trim().slice(0,16)||"星空旅人";let p=state.players.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:Date.now()+Math.random(),name,points:0};state.players.push(p)}state.player=p.id;save();render();return}});
document.getElementById("logout").onclick=()=>{stop();state.player=null;save();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&active)result(0,"abandoned",active.id)});
render();
})();
</script></body></html>
