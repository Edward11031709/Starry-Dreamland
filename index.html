.cipher-slots{display:grid;grid-template-columns:repeat(4,minmax(45px,72px));gap:10px;justify-content:center;margin:20px auto}.cipher-slots span{display:grid;place-items:center;height:64px;border:1px solid var(--line);border-radius:14px;background:#101831;color:#8b8cae;font-size:25px}.cipher-slots span.filled{color:var(--gold);box-shadow:0 0 18px #efd49a33}.cipher-symbols{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px}.cipher-symbol{width:52px;height:52px;border-radius:13px;border:1px solid var(--line);background:#25294f;color:var(--gold);font-size:25px}.cipher-symbol.picked{opacity:.28;transform:scale(.92)}.cipher-history{display:grid;gap:8px;margin-top:18px}.cipher-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#111a38;border:1px solid #a994dc33;font-size:13px}.cipher-code{color:var(--gold);font-size:19px;letter-spacing:3px}.orbit-labels{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--gold);font-size:12px;margin:12px 4px}.orbit-map{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:9px;align-items:center;justify-content:center;max-width:590px;margin:14px auto 20px}.orbit-rail{display:grid;grid-template-rows:repeat(5,58px);gap:7px}.orbit-rail span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid;border-radius:12px;font-size:12px;font-weight:800;text-align:center;line-height:1.15}.orbit-rail small{font-size:9px;letter-spacing:1px}.orbit-rail-in span{grid-row:var(--endpoint-row);color:#ffe1a0;border-color:#efd49a;background:linear-gradient(145deg,#5a4529,#211b35);box-shadow:0 0 18px #efd49a33}.orbit-rail-out span{grid-row:var(--endpoint-row);color:#aaffed;border-color:#65e6c6;background:linear-gradient(145deg,#174e53,#14263b);box-shadow:0 0 22px #65e6c655;animation:orbitExitPulse 1.8s ease-in-out infinite}@keyframes orbitExitPulse{50%{box-shadow:0 0 30px #65e6c699,inset 0 0 14px # .auth-panel{padding:24px}.auth-field{display:block;width:100%;padding:13px 14px;margin:10px 0;border-radius:12px;background:#0d1432;border:1px solid var(--line);color:white}.auth-field:focus{outline:2px solid #b49bdd88}.auth-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.auth-actions .btn{flex:1;min-width:135px}.auth-message{min-height:44px;font-size:12px;line-height:1.7;color:var(--muted);margin:14px 0 0}

.plaza-3d{height:clamp(430px,52vw,590px);min-height:430px;background:#080d2a;isolation:isolate;border-color:#c5b6ef55;box-shadow:0 28px 100px #030615aa,0 0 44px #7768c733}
.plaza-3d:before,.plaza-3d:after{display:none}
.starry-3d-stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#343a70 0%,#151b43 47%,#080d2a 100%)}
.starry-3d-canvas{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;outline:none}
.starry-3d-stage[data-status="ready"] .starry-3d-fallback{display:none!important}
.starry-3d-fallback{position:absolute;z-index:0;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f0dfb8;text-align:center;background:radial-gradient(ellipse at 50% 45%,#37345f,#090e2b 76%)}
.starry-3d-fallback strong{font:600 22px Georgia,"Noto Serif TC",serif;color:var(--gold)}
.starry-3d-fallback span{font-size:12px;color:#b9b8d2}
.plaza-topline{position:absolute;z-index:2;left:18px;top:17px;display:flex;align-items:center;gap:9px;pointer-events:none}
.plaza-tag{padding:8px 12px;border:1px solid #e8d39c88;border-radius:99px;background:#0a1035b8;color:#f2dba7;font-size:10px;letter-spacing:2px;backdrop-filter:blur(10px)}
.plaza-camera{padding:7px 10px;border:1px solid #c9c4ee44;border-radius:99px;background:#111735a8;color:#d3cbe9;font-size:10px;backdrop-filter:blur(10px)}
.plaza-3d .locked{z-index:3;background:#101633c9;backdrop-filter:blur(12px)}
.plaza-controls{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:70%;pointer-events:none}.plaza-controls span{padding:7px 10px;border:1px solid #c2b4e355;border-radius:99px;background:#0c1236bb;color:#e3d8f4;font-size:10px;backdrop-filter:blur(10px)}.plaza-status{position:absolute;z-index:2;right:17px;bottom:15px;padding:8px 11px;border-radius:99px;border:1px solid #c2b4e355;background:#0c1236bb;color:#e3d8f4;font-size:10px;backdrop-filter:blur(12px);pointer-events:none}
.plaza-3d .caption{z-index:2;text-shadow:0 2px 8px #000}
.plaza-3d[data-status="fallback"] .starry-3d-stage{background:#080d2a}
@media(max-width:760px){.plaza-3d{height:500px;min-height:500px}.plaza-topline{left:10px;top:10px;gap:5px}.plaza-tag{font-size:8px;letter-spacing:1px;padding:7px 9px}.plaza-camera{font-size:9px;padding:7px 8px}.plaza-3d .locked{right:9px;top:53px;font-size:10px}.plaza-status{left:10px;right:auto;bottom:9px;font-size:9px;max-width:65%}.plaza-3d .caption{bottom:42px;left:12px;font-size:9px}}

.answer-review{margin:22px 0 18px;padding:18px 20px;text-align:left;border:1px solid #e7cf9977;border-radius:18px;background:linear-gradient(145deg,#24234f,#111831)}
.answer-review h3{margin:0 0 8px;color:var(--gold);font-size:18px}.answer-review p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.7}.answer-review ol{margin:0;padding-left:22px;color:#eee6d3;font-size:13px;line-height:1.9}
.shooting-panel,.mirror-panel{max-width:820px;margin:auto}.shooting-status,.mirror-status{padding:12px 14px;border:1px solid #d7c28a66;border-radius:12px;background:#151b3dcc;color:var(--gold);text-align:center;margin:10px 0 16px}
.shooting-grid{display:grid;grid-template-columns:repeat(3,minmax(76px,1fr));gap:12px;max-width:460px;margin:0 auto}
.shoot-target{aspect-ratio:1;border-radius:18px;border:1px solid #8277b5;background:radial-gradient(circle at 50% 35%,#414276,#151b3a 72%);color:#d9d5ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 0 18px #8a78cd22;transition:.15s}
.shoot-target span{font-size:35px}.shoot-target small{font-size:10px;color:#a9a4c8}.shoot-target.lit{border:2px solid #ffe2a0;background:radial-gradient(circle,#ffe6a455,#554879 52%,#222245);box-shadow:0 0 26px #ffd98caa,inset 0 0 22px #ffe8ad77;transform:scale(1.04);color:#fff4d4}
.shoot-target.hit{border-color:#a4e7d0;background:radial-gradient(circle,#a4e7d044,#203e49);box-shadow:0 0 22px #8be0c288}.shoot-target.wrong{border-color:#ef8b9f;box-shadow:0 0 20px #ef718d99;transform:translateX(3px)}
.mirror-stage{padding:18px;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#46416f,#121831 75%);border:1px solid #b9a3df55}

.mirror-pad{aspect-ratio:1;border-radius:20px;border:1px solid #9e8bc4;background:linear-gradient(145deg,#373461,#171d3d);color:#eee2c9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.18s;box-shadow:inset 0 0 18px #c2a7ee1b}
.mirror-pad span{font-size:32px}.mirror-pad small{font-size:10px;color:#c7bedc}.mirror-pad.flash{background:radial-gradient(circle,#ffe7ad,#b78bd0 55%,#39315f);color:#231832;box-shadow:0 0 32px #ffe2a1bb;transform:scale(1.07)}
.mirror-progress{text-align:center;color:#d8cce9;font-size:13px;min-height:22px}
@media(max-width:600px){.shooting-grid{gap:7px}.shoot-target span{font-size:28px}.mirror-pads{gap:7px}.mirror-pad{border-radius:14px}.mirror-pad span{font-size:25px}.answer-review{padding:14px}}

<script>
(function(){
const STORE="starryDreamland.githubPages.demo";
let mazeX=1,mazeY=1,mazeKeys=0,mazeSteps=0,mazeMap=[],mazeKeyPositions=[];
const KIDS_GAME_IDS=["constellation","maze","child-connect","child-memory"];
const ADULT_GAME_IDS=["moon","cipher","orbit","shooting-range","mirror-house"];
const AVATARS=[
 {id:"wanderer",name:"星旅者",description:"夜藍旅袍、星紋披風與金色星冠。",cost:0,rarity:"免費"},
 {id:"moon-priestess",name:"月影祭司",description:"銀紫月紗、月環頭飾與冰晶肩飾。",cost:80,rarity:"稀有"},
 {id:"nebula-prince",name:"星雲王子",description:"深海藍綠禮袍、星芒披肩與琉璃冠。",cost:120,rarity:"稀有"},
 {id:"crystal-witch",name:"水晶魔女",description:"紫晶巫帽、星砂披風與流光魔石。",cost:180,rarity:"史詩"},
 {id:"astral-knight",name:"星辰騎士",description:"星銀甲片、金曜角盔與守護披風。",cost:220,rarity:"史詩"},
 {id:"celestial-guardian",name:"星界守護者",description:"象牙白禮甲、日輪星冠與神聖光環。",cost:320,rarity:"傳說"}
];
let state=read(),clock=null,frame=null,active=null;
const cloudMode=!!(window.STARRY_CONFIG&&window.STARRY_CONFIG.mode==="supabase");
let sb=window.SD_SUPABASE||null,cloudUser=null,cloudBusy=false;
let parkChannel=null,parkSocialStarting=false,parkMoveSentAt=0,parkMoveLast=null;
let parkLocalPosition={x:0,z:33,yaw:0};
let parkRemoteMap=new Map();
const parkSessionId=(window.crypto&&typeof window.crypto.randomUUID==="function")?window.crypto.randomUUID():("visitor-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2));

function read(){let data;try{data=Object.assign({player:null,players:[],records:[]},JSON.parse(localStorage.getItem(STORE)||"{}"))}catch(e){data={player:null,players:[],records:[]}}data.players.forEach(p=>{const records=data.records.filter(r=>r.uid===p.id);if(typeof p.adultPoints!=="number")p.adultPoints=records.filter(r=>!KIDS_GAME_IDS.includes(r.game)).reduce((s,r)=>s+(Number(r.reward)||0),0);if(typeof p.kidsPoints!=="number")p.kidsPoints=records.filter(r=>KIDS_GAME_IDS.includes(r.game)).reduce((s,r)=>s+(Number(r.reward)||0),0);p.points=p.adultPoints});return data}
function save(){state.players.forEach(p=>p.points=Number(p.adultPoints)||0);if(!cloudMode)localStorage.setItem(STORE,JSON.stringify(state))}
function me(){return state.players.find(p=>p.id===state.player)}
function total(){return me()?Number(me().adultPoints)||0:0}
function kidsTotal(){return me()?Number(me().kidsPoints)||0:0}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900)}
function header(){const p=me();document.getElementById("pill").classList.toggle("hidden",!p);if(p){document.getElementById("pname").textContent=p.name;document.getElementById("points").textContent="可用 "+(Number(p.avatarPoints??p.adultPoints)||0)+" ✦";const adminMark=document.getElementById("adminMark");if(adminMark)adminMark.classList.toggle("hidden",!p.isAdmin);const out=document.getElementById("logout");if(out)out.textContent=cloudMode&&!cloudUser?"登入／註冊":"登出"}}
function shell(s){document.getElementById("app").innerHTML=s}
function nav(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function stop(){if(clock){clearInterval(clock);clock=null}if(frame){cancelAnimationFrame(frame);frame=null}if(active&&active.cleanup)active.cleanup();active=null}
function login(){nav("");header();shell('<section class="hero"><div class="eyebrow">A JOURNEY THROUGH THE STARS</div><h1>星夢樂園</h1><p>使用全球帳號登入，跨裝置保存你的星空旅程。</p></section><div class="panel auth-panel" style="max-width:520px;margin:auto;text-align:center"><div style="font-size:58px;color:var(--gold)">✦</div><h2 style="font:600 28px Georgia,serif;color:var(--gold)">歡迎來到星夢樂園</h2><p style="color:var(--muted)">建立帳號或登入，成人與星芽紀錄都會同步保存。</p><input id="authEmail" class="auth-field" type="email" autocomplete="email" placeholder="電子郵件地址"><input id="authPassword" class="auth-field" type="password" autocomplete="current-password" placeholder="密碼（至少 8 個字元）"><input id="authNickname" class="auth-field" maxlength="16" autocomplete="nickname" placeholder="旅人暱稱（註冊時必填）"><div class="auth-actions"><button class="btn" id="cloudLogin">登入</button><button class="btn alt" id="cloudRegister">建立全球帳號</button></div><button class="ghost" id="cloudReset">忘記密碼？寄送重設連結</button><button class="ghost" id="cloudGuestPreview">先進入 3D 廣場預覽（不儲存成績）</button><p id="authMessage" class="auth-message" aria-live="polite">帳號使用 Supabase 雲端保存。請勿使用與其他網站相同的密碼。</p><p style="font-size:11px;color:#9999bc;margin-top:18px">星芽探索請使用家長管理的帳號與遊戲暱稱；排行榜不會公開電子郵件。</p></div>')}
function authMessage(message,isError=false){const el=document.getElementById("authMessage");if(el){el.textContent=message;el.style.color=isError?"#f1a7b4":"#b9b8d2"}else say(message)}
function authFormValues(){return {email:(document.getElementById("authEmail")?.value||"").trim().toLowerCase(),password:document.getElementById("authPassword")?.value||"",nickname:(document.getElementById("authNickname")?.value||"").trim().slice(0,16)}}
function authRedirectUrl(){return window.location.origin+window.location.pathname}
function friendlyAuthError(error){const message=String(error?.message||error||"未知錯誤");if(/Invalid login credentials/i.test(message))return "電子郵件或密碼不正確。";if(/Email not confirmed/i.test(message))return "電子郵件尚未驗證，請先查看信箱。";if(/User already registered/i.test(message))return "這個電子郵件已註冊，請直接登入。";if(/Password should be at least/i.test(message))return "密碼長度不足，請使用至少 8 個字元。";if(/rate limit/i.test(message))return "操作次數太頻繁，請稍後再試。";return message}
async function loadCloudPlayer(user,nicknameHint=""){
 if(!sb||!user)throw new Error("目前沒有有效的雲端登入工作階段。");
 const profileFields="user_id,nickname,created_at,avatar_id,owned_avatar_ids,avatar_spent_points";
 const {data:profile,error:profileError}=await sb.from("sd_profiles").select(profileFields).eq("user_id",user.id).maybeSingle();
 if(profileError)throw profileError;
 let actualProfile=profile;
 if(!actualProfile){
  const candidate=(nicknameHint||user.user_metadata?.nickname||("旅人"+user.id.slice(0,4))).trim().slice(0,16)||("旅人"+user.id.slice(0,4));
  const {data:inserted,error:insertError}=await sb.from("sd_profiles").insert({user_id:user.id,nickname:candidate}).select(profileFields).single();
  if(insertError)throw insertError;
  actualProfile=inserted;
 }
 const [{data:rows,error:recordsError},{data:avatarRows,error:avatarError},{data:isAdmin,error:adminError}]=await Promise.all([
  sb.rpc("sd_my_game_records"),
  sb.rpc("sd_avatar_state"),
  sb.rpc("sd_is_admin")
 ]);
 if(recordsError)throw recordsError;
 if(avatarError)throw avatarError;
 if(adminError)throw adminError;
 const records=(rows||[]).map(r=>({id:r.record_id,uid:user.id,name:actualProfile.nickname,game:r.game_id,category:r.category,score:Number(r.score)||0,status:r.status,reward:Number(r.reward)||0,time:Date.parse(r.created_at)||Date.now()}));
 const adultPoints=records.filter(r=>r.category==="adult").reduce((sum,r)=>sum+r.reward,0);
 const kidsPoints=records.filter(r=>r.category==="kids").reduce((sum,r)=>sum+r.reward,0);
 const avatarState=Array.isArray(avatarRows)?avatarRows[0]:avatarRows;
 cloudUser=user;
 state.players=[{
  id:user.id,name:actualProfile.nickname,adultPoints,kidsPoints,points:adultPoints,
  created:Date.parse(actualProfile.created_at)||Date.now(),
  avatarId:actualProfile.avatar_id||avatarState?.avatar_id||"wanderer",
  ownedAvatarIds:actualProfile.owned_avatar_ids||avatarState?.owned_avatar_ids||["wanderer"],
  avatarPoints:Number(avatarState?.points_balance)||0,
  isAdmin:isAdmin===true
 }];
 state.player=user.id;
 state.records=records.sort((a,b)=>a.time-b.time);
 header();
 home();
}
function cloudGuestPreview(){cloudUser=null;const id="guest-preview-"+Date.now();state.players=[{id,name:"訪客旅人",adultPoints:0,kidsPoints:0,points:0,created:Date.now()}];state.player=id;state.records=[];render()}
async function cloudLogin(){
 if(cloudBusy)return;cloudBusy=true;
 const values=authFormValues();
 try{
  if(!sb)throw new Error("Supabase 連線尚未完成，請重新整理頁面。");
  if(!values.email||!values.password)throw new Error("請輸入電子郵件與密碼。");
  const {data,error}=await sb.auth.signInWithPassword({email:values.email,password:values.password});
  if(error)throw error;
  await loadCloudPlayer(data.user,values.nickname);
 }catch(error){authMessage(friendlyAuthError(error),true)}
 finally{cloudBusy=false}
}
async function cloudRegister(){
 if(cloudBusy)return;cloudBusy=true;
 const values=authFormValues();
 try{
  if(!sb)throw new Error("Supabase 連線尚未完成，請重新整理頁面。");
  if(!values.email||!values.password||!values.nickname)throw new Error("註冊時請填寫電子郵件、密碼與旅人暱稱。");
  if(values.password.length<8)throw new Error("密碼至少需要 8 個字元。");
  const {data,error}=await sb.auth.signUp({email:values.email,password:values.password,options:{emailRedirectTo:authRedirectUrl(),data:{nickname:values.nickname}}});
  if(error)throw error;
  if(data.session&&data.user){await loadCloudPlayer(data.user,values.nickname)}
  else{authMessage("註冊申請已送出！請開啟電子郵件中的驗證連結，再回到星夢樂園登入。")}
 }catch(error){authMessage(friendlyAuthError(error),true)}
 finally{cloudBusy=false}
}
function showPasswordRecovery(){nav("");header();shell('<section class="hero"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>設定新密碼</h1><p>請設定一組新的登入密碼。</p></section><div class="panel auth-panel" style="max-width:520px;margin:auto;text-align:center"><input id="newPassword" class="auth-field" type="password" autocomplete="new-password" placeholder="新密碼（至少 8 個字元）"><button class="btn" id="cloudUpdatePassword">更新密碼</button><p id="authMessage" class="auth-message" aria-live="polite">更新成功後即可使用新密碼登入。</p></div>')}
async function cloudUpdatePassword(){const password=document.getElementById("newPassword")?.value||"";if(password.length<8){authMessage("新密碼至少需要 8 個字元。",true);return}try{const {data,error}=await sb.auth.updateUser({password});if(error)throw error;authMessage("密碼已更新。");if(data.user)await loadCloudPlayer(data.user)}catch(error){authMessage(friendlyAuthError(error),true)}}
async function cloudResetPassword(){
 if(cloudBusy)return;
 const email=(document.getElementById("authEmail")?.value||"").trim().toLowerCase();
 if(!email){authMessage("請先輸入註冊時使用的電子郵件。",true);return}
 try{
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:authRedirectUrl()});
  if(error)throw error;
  authMessage("密碼重設信已送出，請查看電子郵件。");
 }catch(error){authMessage(friendlyAuthError(error),true)}
}
async function bootCloud(){
 sb=window.SD_SUPABASE||null;
 if(!sb){login();authMessage("雲端連線載入失敗："+(window.SD_SUPABASE_ERROR||"請檢查網路後重新整理。"),true);return}
 try{
  const {data,error}=await sb.auth.getSession();
  if(error)throw error;
  if(data.session?.user)await loadCloudPlayer(data.session.user);
  else{cloudUser=null;state.player=null;state.players=[];state.records=[];login()}
  sb.auth.onAuthStateChange((event,session)=>{
   if(event==="SIGNED_OUT"){cloudUser=null;state.player=null;state.players=[];state.records=[];login()}
   if(event==="PASSWORD_RECOVERY")showPasswordRecovery();
  });
 }catch(error){cloudUser=null;state.player=null;state.players=[];state.records=[];login();authMessage("無法讀取登入狀態："+friendlyAuthError(error),true)}
}
async function syncCloudRecord(record){
 if(!cloudMode||!sb||!cloudUser)return;
 const {error}=await sb.from("sd_game_records").insert({user_id:cloudUser.id,game_id:record.game,category:record.category,score:record.score,status:record.status,reward:record.reward});
 if(error){say("本次成績尚未同步雲端："+friendlyAuthError(error));return}
 const {data:rows,error:readError}=await sb.rpc("sd_my_game_records");
 if(readError){say("成績已送出，但暫時無法更新星塵總數。");return}
 const refreshed=(rows||[]).map(r=>({id:r.record_id,uid:cloudUser.id,name:me()?.name||"",game:r.game_id,category:r.category,score:Number(r.score)||0,status:r.status,reward:Number(r.reward)||0,time:Date.parse(r.created_at)||Date.now()}));
 state.records=refreshed.sort((a,b)=>a.time-b.time);
 const p=me();if(p){p.adultPoints=refreshed.filter(r=>r.category==="adult").reduce((s,r)=>s+r.reward,0);p.kidsPoints=refreshed.filter(r=>r.category==="kids").reduce((s,r)=>s+r.reward,0);p.points=p.adultPoints}
 const {data:avatarRows,error:avatarError}=await sb.rpc("sd_avatar_state");
 if(!avatarError&&Array.isArray(avatarRows)&&avatarRows[0]&&p){
  p.avatarPoints=Number(avatarRows[0].points_balance)||0;
  p.ownedAvatarIds=avatarRows[0].owned_avatar_ids||p.ownedAvatarIds;
  p.avatarId=avatarRows[0].avatar_id||p.avatarId;
 }
 header();
 const totalEl=document.getElementById("resultTotal");if(totalEl)totalEl.textContent=(KIDS_GAME_IDS.includes(record.game)?kidsTotal():total())+" ✦";
}

function renderParkSocialGate(kind,message){
 const online=document.getElementById("parkOnlineCount"),list=document.getElementById("parkPlayers"),feed=document.getElementById("parkChatMessages"),status=document.getElementById("parkChatStatus"),input=document.getElementById("parkChatInput"),send=document.getElementById("parkChatSend");
 if(online)online.textContent=kind==="admin"?"隱身模式":"尚未連線";
 if(list)list.innerHTML='<div class="chat-placeholder">'+esc(message)+'</div>';
 if(feed)feed.innerHTML='<div class="chat-placeholder">'+esc(message)+'</div>';
 if(status)status.textContent=kind==="admin"?"管理員隱身中":kind==="guest"?"登入雲端帳號後即可加入":"正在連線園區頻道…";
 if(input)input.disabled=true;if(send)send.disabled=true;
}
function appendParkChat(row){
 const feed=document.getElementById("parkChatMessages");if(!feed||!row)return;
 if(row.id&&feed.querySelector('[data-chat-id="'+String(row.id)+'"]'))return;
 const empty=feed.querySelector(".chat-placeholder");if(empty)empty.remove();
 const item=document.createElement("article");item.className="park-chat-message";
 if(row.id)item.dataset.chatId=String(row.id);
 const top=document.createElement("div");top.className="park-chat-message-top";
 const name=document.createElement("b");name.textContent=String(row.nickname||"星空旅人");
 const time=document.createElement("time");time.textContent=row.created_at?new Date(row.created_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}):"剛剛";
 const body=document.createElement("p");body.textContent=String(row.message||"");
 top.append(name,time);item.append(top,body);feed.append(item);
 while(feed.children.length>40)feed.firstElementChild.remove();
 feed.scrollTop=feed.scrollHeight;
}
function renderParkOnline(players){
 const online=document.getElementById("parkOnlineCount"),list=document.getElementById("parkPlayers");
 if(!online||!list)return;
 const unique=new Map();
 (players||[]).forEach(p=>{if(p&&p.sessionId)unique.set(p.sessionId,p)});
 const rows=[...unique.values()];
 online.textContent=rows.length+" 位旅人在線";
 list.innerHTML="";
 if(!rows.length){list.innerHTML='<div class="chat-placeholder">目前沒有其他旅人在線，等等看星門是否有人抵達。</div>';return}
 rows.slice(0,12).forEach(p=>{
  const item=document.createElement("div");item.className="park-online-person";
  const orb=document.createElement("span");orb.className="park-online-orb";orb.textContent="✦";
  const name=document.createElement("b");name.textContent=(p.sessionId===parkSessionId?"你 · ":"")+String(p.nickname||"星空旅人");
  const state=document.createElement("small");state.textContent=p.sessionId===parkSessionId?"正在探索":"在線探索中";
  item.append(orb,name,state);list.append(item);
 });
}
function renderParkVisitorMarkers(players){
 const group=document.getElementById("parkMapVisitors");if(!group)return;
 group.replaceChildren();
 (players||[]).forEach(p=>{
  if(!p||p.sessionId===parkSessionId)return;
  const x=Math.max(-41,Math.min(41,Number(p.x)||0)),z=Math.max(-43,Math.min(43,Number(p.z)||0));
  const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("cx",String(x));dot.setAttribute("cy",String(z));dot.setAttribute("r","1.55");dot.setAttribute("class","map-visitor");
  const title=document.createElementNS("http://www.w3.org/2000/svg","title");title.textContent=String(p.nickname||"旅人");dot.append(title);group.append(dot);
 });
}
function currentParkPresence(){
 const p=me();return {
  sessionId:parkSessionId,nickname:p?.name||"星空旅人",avatarId:p?.avatarId||"wanderer",
  x:parkLocalPosition.x,z:parkLocalPosition.z,yaw:parkLocalPosition.yaw,
  onlineAt:new Date().toISOString()
 };
}
async function refreshParkPresence(){
 if(!parkChannel||!cloudUser||me()?.isAdmin)return;
 try{await parkChannel.track(currentParkPresence())}catch(error){console.warn("Park presence update failed:",error)}
}
async function loadParkChatHistory(){
 if(!sb||!parkChannel||me()?.isAdmin)return;
 const {data,error}=await sb.from("sd_chat_messages")
  .select("id,nickname,message,created_at")
  .order("created_at",{ascending:false}).limit(40);
 if(error){const status=document.getElementById("parkChatStatus");if(status)status.textContent="聊天紀錄暫時無法載入";console.warn("Park chat history failed:",error);return}
 const feed=document.getElementById("parkChatMessages");if(feed)feed.innerHTML="";
 (data||[]).slice().reverse().forEach(appendParkChat);
 if(!data?.length){const feed=document.getElementById("parkChatMessages");if(feed)feed.innerHTML='<div class="chat-placeholder">夜色正好，向其他旅人打聲招呼吧。</div>'}
}
async function startParkSocial(){
 const feed=document.getElementById("parkChatMessages");if(!feed)return;
 if(!cloudMode||!cloudUser){renderParkSocialGate("guest","登入遊戲帳號後，就能在園區遇見其他旅人並即時聊天。");return}
 if(me()?.isAdmin){renderParkSocialGate("admin","管理員隱身模式已啟用：你的角色、在線狀態與聊天紀錄不會公開。");renderParkVisitorMarkers([]);window.dispatchEvent(new CustomEvent("starry-3d-players",{detail:{players:[]}}));return}
 if(parkChannel){await loadParkChatHistory();return}
 if(parkSocialStarting)return;
 parkSocialStarting=true;
 const status=document.getElementById("parkChatStatus");if(status)status.textContent="正在連接星夢園區…";
 const channel=sb.channel("park:lobby",{
  config:{private:true,presence:{key:parkSessionId},broadcast:{ack:false,self:false}}
 });
 parkChannel=channel;
 channel
  .on("presence",{event:"sync"},()=>{
   const state=channel.presenceState(),players=[],seen=new Set();
   Object.values(state).flat().forEach(p=>{
    if(p&&p.sessionId&&!seen.has(p.sessionId)){seen.add(p.sessionId);players.push(p)}
   });
   renderParkOnline(players);renderParkVisitorMarkers(players);
   window.dispatchEvent(new CustomEvent("starry-3d-players",{detail:{players}}));
  })
  .on("broadcast",{event:"player_move"},({payload})=>{
   if(!payload||!payload.sessionId||payload.sessionId===parkSessionId)return;
   parkRemoteMap.set(payload.sessionId,payload);
   renderParkVisitorMarkers([...parkRemoteMap.values()]);
   window.dispatchEvent(new CustomEvent("starry-3d-player-move",{detail:{player:payload}}));
  })
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"sd_chat_messages"},payload=>{
   if(payload&&payload.new)appendParkChat(payload.new);
  })
  .subscribe(async state=>{
   if(state==="SUBSCRIBED"){
    parkSocialStarting=false;
    try{
     await channel.track(currentParkPresence());
     if(status)status.textContent="已連線 · 你正在星夢樂園中";
     const input=document.getElementById("parkChatInput"),send=document.getElementById("parkChatSend");
     if(input)input.disabled=false;if(send)send.disabled=false;
     await loadParkChatHistory();
    }catch(error){if(status)status.textContent="已加入園區，但同步狀態失敗";console.warn("Park channel setup failed:",error)}
   }else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT"||state==="CLOSED"){
    parkSocialStarting=false;
    if(status)status.textContent="園區連線中斷，請重新整理頁面再試";
   }
  });
}
async function sendParkChat(){
 if(!parkChannel||!sb||!cloudUser||me()?.isAdmin)return;
 const input=document.getElementById("parkChatInput");if(!input)return;
 const message=input.value.trim();
 if(!message){input.focus();return}
 if(message.length>180){say("聊天訊息最多 180 個字。");return}
 const send=document.getElementById("parkChatSend");if(send)send.disabled=true;
 const {data,error}=await sb.from("sd_chat_messages")
  .insert({user_id:cloudUser.id,message})
  .select("id,nickname,message,created_at").single();
 if(error){say("訊息未能送出："+friendlyAuthError(error))}
 else{appendParkChat(data);input.value=""}
 if(send)send.disabled=false;
 input.focus();
}
async function stopParkSocial(){
 const channel=parkChannel;parkChannel=null;parkSocialStarting=false;parkMoveLast=null;parkRemoteMap.clear();
 if(channel&&sb){try{await channel.untrack()}catch(e){}try{await sb.removeChannel(channel)}catch(e){}}
 renderParkVisitorMarkers([]);
 window.dispatchEvent(new CustomEvent("starry-3d-players",{detail:{players:[]}}));
}

function startOrbit(){

 let sy=1+Math.floor(Math.random()*3),x=0,y=sy,path=[[x,y]],rotations=0,sec=120;
 for(let col=0;col<4;col++){
  x++;path.push([x,y]);

 const exitY=path[path.length-1][1];
 const grid=Array.from({length:n},()=>Array.from({length:n},()=>({kind:Math.random()<.5?"S":"L",rot:Math.floor(Math.random()*4)})));
 function ports(tile){
  const pairs=tile.kind==="S"?[["E","W"],["N","S"]]:[["N","E"],["E","S"],["S","W"],["W","N"]];
  return pairs[tile.rot%pairs.length]
 }

 }

  const wanted=[i===0?"W":dir(p,path[i-1]),i===path.length-1?"E":dir(p,path[i+1])];

 });

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="cloudGuestPreview"){cloudGuestPreview();return}if(b.id==="cloudLogin"){cloudLogin();return}if(b.id==="cloudRegister"){cloudRegister();return}if(b.id==="cloudReset"){cloudResetPassword();return}if(b.id==="cloudUpdatePassword"){cloudUpdatePassword();return}if(b.dataset.mapExpand!==undefined){openParkMap();return}if(b.dataset.mapClose!==undefined){document.getElementById("parkMapModal")?.remove();return}if(b.dataset.page){if(b.dataset.page==="home")home();if(b.dataset.page==="children")children();if(b.dataset.page==="leaderboard")rank();if(b.dataset.page==="history")history();return}if(b.dataset.wardrobe!==undefined){wardrobe();return}if(b.dataset.avatarEquip){equipAvatar(b.dataset.avatarEquip);return}if(b.dataset.avatarUnlock){unlockAvatar(b.dataset.avatarUnlock);return}if(b.dataset.game){start(b.dataset.game);return}if(b.dataset.launch){launch(b.dataset.launch);return}if(b.dataset.dir){const d={up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"}[b.dataset.dir];window.dispatchEvent(new KeyboardEvent("keydown",{key:d}));return}if(b.dataset.quit){result(0,"abandoned",active?active.id:"unknown");return}if(b.dataset.childgame){start(b.dataset.childgame);return}if(b.dataset.child){if(b.dataset.child==="connect")childConnect();else childMemory();return}if(b.id==="enter"){let name=(document.getElementById("nickname").value||"星空旅人").trim().slice(0,16)||"星空旅人";let p=state.players.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:Date.now()+Math.random(),name,points:0,created:Date.now()};state.players.push(p)}state.player=p.id;save();render();return}});
document.getElementById("logout").onclick=async()=>{stop();if(cloudMode&&sb){const {error}=await sb.auth.signOut();if(error)say("登出時發生問題："+friendlyAuthError(error))}cloudUser=null;state.player=null;state.players=[];state.records=[];save();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&active)result(0,"abandoned",active.id)});
window.addEventListener("starry-supabase-ready",bootCloud);
window.addEventListener("starry-3d-ready",()=>{const host=document.getElementById("starry-3d");if(host&&window.Starry3D)window.Starry3D.mount(host)});
window.addEventListener("starry-3d-error",()=>{const host=document.getElementById("starry-3d"),status=document.getElementById("starry-3d-status");if(host)host.dataset.status="fallback";if(status)status.textContent="3D 元件暫時無法載入；請使用下方遊戲卡片。";const fallback=host?.querySelector(".starry-3d-fallback");if(fallback)fallback.innerHTML="<strong>3D 場景暫時無法載入</strong><span>遊戲入口與雲端資料仍可正常使用，請稍後重新整理。</span>"});
window.addEventListener("starry-3d-portal",event=>{const gameId=event.detail&&event.detail.gameId;if(gameId&&ADULT_GAME_IDS.includes(gameId))start(gameId)});
window.addEventListener("starry-3d-map",event=>{
 const d=event.detail;if(!d)return;
 const x=Math.max(-41,Math.min(41,Number(d.x)||0)),z=Math.max(-43,Math.min(43,Number(d.z)||0));
 document.querySelectorAll(".map-player").forEach(marker=>{
  marker.setAttribute("transform","translate("+x+" "+z+") rotate("+(-Number(d.yaw||0)*180/Math.PI)+")");
 });
});
function openParkMap(){
 if(document.getElementById("parkMapModal"))return;
 const source=document.querySelector(".park-map-svg");
 if(!source)return;
 const modal=document.createElement("div");modal.id="parkMapModal";modal.className="park-map-modal";
 const panel=document.createElement("div");panel.className="park-map-modal-panel";
 const heading=document.createElement("div");heading.className="park-map-modal-heading";
 heading.innerHTML='<div><small>STAR DREAMLAND · PARK GUIDE</small><h2>星夢樂園全區導覽</h2></div><button type="button" class="ghost" data-map-close>關閉 ✕</button>';
 const map=source.cloneNode(true);map.classList.add("park-map-svg-large");map.removeAttribute("id");
 const legend=document.querySelector(".park-map-legend")?.cloneNode(true);
 const note=document.createElement("p");note.className="park-map-note";note.textContent="地圖上方為城堡與遠端園區，下方為入園方向；金色箭頭代表你目前的位置與朝向。";
 panel.append(heading,map);if(legend)panel.append(legend);panel.append(note);modal.append(panel);
 modal.addEventListener("click",e=>{if(e.target===modal||e.target.closest("[data-map-close]"))modal.remove()});
 document.addEventListener("keydown",function closeMap(e){if(e.key==="Escape"){modal.remove();document.removeEventListener("keydown",closeMap)}},{once:true});
 document.body.append(modal);
}

window.addEventListener("starry-3d-action",event=>{
 const action=event.detail&&event.detail.action;
 if(action==="ticket-booth")say("星夢入園票亭：歡迎來到星夢樂園！目前開放自由探索；成人遊戲與星芽探索區可從園區入口開始。");
});
window.addEventListener("starry-supabase-error",()=>{login();authMessage("無法載入 Supabase 連線元件："+(window.SD_SUPABASE_ERROR||"請確認網路後重新整理。"),true)});
if(cloudMode){login();if(window.SD_SUPABASE)bootCloud()}else render();
})();
</script></body></html>
