.auth-panel{padding:24px}.auth-field{display:block;width:100%;padding:13px 14px;margin:10px 0;border-radius:12px;background:#0d1432;border:1px solid var(--line);color:white}.auth-field:focus{outline:2px solid #b49bdd88}.auth-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.auth-actions .btn{flex:1;min-width:135px}.auth-message{min-height:44px;font-size:12px;line-height:1.7;color:var(--muted);margin:14px 0 0}

.plaza-3d{height:clamp(430px,52vw,590px);min-height:430px;background:#080d2a;isolation:isolate;border-color:#c5b6ef55;box-shadow:0 28px 100px #030615aa,0 0 44px #7768c733}
.plaza-3d:before,.plaza-3d:after{display:none}
.starry-3d-stage{position:absolute;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#343a70 0%,#151b43 47%,#080d2a 100%)}
.starry-3d-canvas{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;outline:none}
.starry-3d-stage[data-status="ready"] .starry-3d-fallback{display:none!important}
.starry-3d-fallback{position:absolute;z-index:0;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f0dfb8;text-align:center;background:radial-gradient(ellipse at 50% 45%,#37345f,#090e2b 76%)}
.starry-3d-fallback strong{font:600 22px Georgia,"Noto Serif TC",serif;color:var(--gold)}
.starry-3d-fallback span{font-size:12px;color:#b9b8d2}
.plaza-topline{position:absolute;z-index:2;left:18px;top:17px;display:flex;align-items:center;gap:9px;pointer-events:none}
.plaza-tag{padding:8px 12px;border:1px solid #e8d39c88;border-radius:99px;background:#0a1035b8;color:#f2dba7;font-size:10px;letter-spacing:2px;backdrop-filter:blur(10px)}
.plaza-camera{padding:7px 10px;border:1px solid #c9c4ee44;border-radius:99px;background:#111735a8;color:#d3cbe9;font-size:10px;backdrop-filter:blur(10px)}
.plaza-3d .locked{z-index:3;background:#101633c9;backdrop-filter:blur(12px)}
.plaza-controls{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:70%;pointer-events:none}.plaza-controls span{padding:7px 10px;border:1px solid #c2b4e355;border-radius:99px;background:#0c1236bb;color:#e3d8f4;font-size:10px;backdrop-filter:blur(10px)}.plaza-status{position:absolute;z-index:2;right:17px;bottom:15px;padding:8px 11px;border-radius:99px;border:1px solid #c2b4e355;background:#0c1236bb;color:#e3d8f4;font-size:10px;backdrop-filter:blur(12px);pointer-events:none}
.plaza-3d .caption{z-index:2;text-shadow:0 2px 8px #000}
.plaza-3d[data-status="fallback"] .starry-3d-stage{background:#080d2a}

.answer-review{margin:22px 0 18px;padding:18px 20px;text-align:left;border:1px solid #e7cf9977;border-radius:18px;background:linear-gradient(145deg,#24234f,#111831)}

.shooting-panel,.mirror-panel{max-width:820px;margin:auto}.shooting-status,.mirror-status{padding:12px 14px;border:1px solid #d7c28a66;border-radius:12px;background:#151b3dcc;color:var(--gold);text-align:center;margin:10px 0 16px}

.shoot-target span{font-size:35px}.shoot-target small{font-size:10px;color:#a9a4c8}.shoot-target.lit{border:2px solid #ffe2a0;background:radial-gradient(circle,#ffe6a455,#554879 52%,#222245);box-shadow:0 0 26px #ffd98caa,inset 0 0 22px #ffe8ad77;transform:scale(1.04);color:#fff4d4}

.mirror-pad span{font-size:32px}.mirror-pad small{font-size:10px;color:#c7bedc}.mirror-pad.flash{background:radial-gradient(circle,#ffe7ad,#b78bd0 55%,#39315f);color:#231832;box-shadow:0 0 32px #ffe2a1bb;transform:scale(1.07)}

/* Live chat speech bubbles and quick reactions */
.park-chat-reactions{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 9px}
.park-chat-reactions button{border:1px solid #c7b5e055;border-radius:99px;padding:6px 10px;background:linear-gradient(135deg,#242448,#101a35);color:#e6d8f5;font-size:10px;cursor:pointer;transition:transform .15s,border-color .15s}
.park-chat-reactions button:hover:not(:disabled){transform:translateY(-1px);border-color:#ecd49b;color:#f5dfb2}
.park-chat-reactions button:disabled{opacity:.38;cursor:not-allowed}
@media(max-width:760px){.park-chat-reactions{gap:5px;padding:0 9px 8px}.park-chat-reactions button{font-size:9px;padding:6px 8px}}

/* Starbud games are the only games carrying a simple-play label. */
.game-type-tag{display:inline-flex;align-items:center;gap:5px;margin:0 0 8px;padding:4px 9px;border:1px solid #d6c4ed66;border-radius:999px;background:linear-gradient(135deg,#8c75d626,#b9a4ef18);color:#e8d7ff;font-size:10px;letter-spacing:.5px}
.game-type-tag:before{content:"✦";color:#e9d49d;font-size:9px}

/* Persistent exploration journal */
.park-journal-panel{margin:18px 0 22px;padding:20px 22px;border:1px solid #d5c09166;border-radius:20px;background:radial-gradient(ellipse at 88% 0%,#8e74c32a,transparent 42%),linear-gradient(145deg,#1c2044f2,#10172feF);box-shadow:0 18px 44px #0004}
.park-journal-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}
.park-journal-heading small{font-size:9px;letter-spacing:3px;color:#b4a2dd}
.park-journal-heading h2{margin:4px 0;color:#f2dba9;font:600 22px "Noto Serif TC","Songti TC","PMingLiU",serif}
.park-journal-heading p{margin:0;color:#b7bad6;font-size:11px;line-height:1.7}
.park-journal-score{display:grid;justify-items:end;gap:2px;min-width:78px}
.park-journal-score b{color:#f5dfae;font:700 21px Georgia,serif}
.park-journal-score small{color:#aaaed0;font-size:10px}
.park-journal-progress{height:6px;overflow:hidden;margin:0 0 15px;border-radius:99px;background:#090f25;border:1px solid #a99ac744}
.park-journal-progress span{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#7d72c9,#b9a1e7,#f0d394);box-shadow:0 0 14px #b6a2ee88;transition:width .45s ease}
.park-journal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.park-journal-item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:8px;min-height:62px;padding:9px 10px;border:1px solid #a99ac533;border-radius:12px;background:linear-gradient(135deg,#252549aa,#101a34ee)}
.park-journal-symbol{width:27px;height:27px;display:grid;place-items:center;border:1px solid #c5b8e344;border-radius:9px;color:#827ba9;background:#11162d;font-size:13px}
.park-journal-item.found{border-color:#d7bd8b88;background:linear-gradient(135deg,#4a3e5b88,#17213a)}
.park-journal-item.found .park-journal-symbol{border-color:#e9d49d;color:#ffe1a4;background:#594a65;box-shadow:0 0 15px #dfbd7a33}
.park-journal-item div{min-width:0}
.park-journal-item b{display:block;overflow:hidden;color:#d8d6ec;font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.park-journal-item small{display:block;margin-top:3px;overflow:hidden;color:#8f94b8;font-size:9px;line-height:1.45;text-overflow:ellipsis;white-space:nowrap}
.park-journal-item.found b{color:#f2ddb0}
.park-journal-item em{display:none}
.park-journal-milestone{margin-top:13px;padding:10px 12px;border:1px solid #ccb98b33;border-radius:11px;background:#0b1430aa;color:#cfc5e8;font-size:11px;line-height:1.65}
@media(max-width:760px){
 .park-journal-panel{padding:15px;border-radius:17px}
 .park-journal-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .park-journal-item{min-height:58px;padding:8px}
 .park-journal-item b{font-size:10px}
 .park-journal-item small{font-size:8px}
}
@media(max-width:420px){
 .park-journal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .park-journal-heading h2{font-size:19px}
 .park-journal-heading p{max-width:230px}
}

/* High-fidelity 3D traveler preview */
.avatar-live-preview-wrap{position:relative;overflow:hidden;margin:14px 0 20px;border:1px solid #d5c29a88;border-radius:20px;background:radial-gradient(ellipse at 50% 48%,#6658a955 0%,#27244b 38%,#10172f 78%);box-shadow:inset 0 0 42px #bca6f11c,0 14px 36px #0005}
.avatar-live-preview-wrap:before,.avatar-live-preview-wrap:after{content:"";position:absolute;pointer-events:none;border:1px solid #e8d4a533;border-radius:50%;width:340px;height:340px;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-18deg);box-shadow:0 0 26px #b59df322}
.avatar-live-preview-wrap:after{width:270px;height:270px;transform:translate(-50%,-50%) rotate(28deg);border-style:dashed;border-color:#bca9e344}
.avatar-live-preview{position:relative;z-index:1;height:330px;min-height:260px;touch-action:none;cursor:grab}
.avatar-live-preview:active{cursor:grabbing}
.avatar-preview-canvas{width:100%;height:100%;display:block;outline:none}
.avatar-live-preview-caption{position:absolute;z-index:2;left:18px;right:18px;bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.avatar-live-preview-caption b{color:#f4dfb2;font:600 15px "Noto Serif TC","Songti TC","PMingLiU",serif;text-shadow:0 2px 10px #080b22}
.avatar-live-preview-caption span{color:#c6bddf;font-size:10px;letter-spacing:.6px;text-shadow:0 2px 8px #080b22}
.avatar-preview-fallback{display:grid;place-items:center;height:100%;color:#d9c8f1;font-size:12px}
.avatar-card-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.avatar-card-actions .btn{width:100%;min-width:0;padding:9px 6px;font-size:10px}
.avatar-card.previewing{border-color:#c8b6f6;box-shadow:0 0 0 1px #c8b6f655,0 0 25px #a78ae622}
.avatar-card-actions .selected-preview{border-color:#f1d18e;background:linear-gradient(135deg,#4d426f,#252345);color:#f8e5b7}
@media(max-width:760px){
 .avatar-live-preview{height:290px;min-height:250px}
 .avatar-live-preview-caption{left:12px;right:12px;bottom:10px}
}
@media(max-width:430px){
 .avatar-live-preview{height:260px;min-height:230px}
 .avatar-card-actions{grid-template-columns:1fr}
}

.avatar-customizer{margin:20px 0 28px;padding:22px;border:1px solid #d2b9f077;border-radius:22px;background:radial-gradient(ellipse at 88% 0%,#6954a533,transparent 42%),linear-gradient(145deg,#211e49ee,#10172fee);box-shadow:0 18px 48px #0005}
.customizer-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.customizer-title small{font-size:9px;letter-spacing:3px;color:#b7a4e9}
.customizer-title h2{margin:5px 0 4px;color:#f3dca7;font:600 23px "Noto Serif TC","Songti TC","PMingLiU",serif}
.customizer-title p{margin:0;color:#bfc1dc;font-size:12px;line-height:1.7}
.customizer-gem{width:54px;height:54px;display:grid;place-items:center;border:1px solid #e6cf9a99;border-radius:17px;background:radial-gradient(circle,#bfa1f255,#171b3a);box-shadow:0 0 28px #a98be544;color:#f8e4b6;font-size:28px}
.avatar-settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.avatar-setting{display:flex;flex-direction:column;gap:7px;min-width:0}
.avatar-setting span{color:#e2d6f5;font-size:11px;font-weight:700;letter-spacing:.5px}
.avatar-setting select{width:100%;min-width:0;padding:11px 34px 11px 12px;border:1px solid #bda9e477;border-radius:12px;background:linear-gradient(135deg,#25264d,#111b39);color:#f4e8d1;font:500 12px -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;outline:none}
.avatar-setting select:focus{border-color:#f1d18e;box-shadow:0 0 0 3px #e9c98222}
.customizer-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:18px}
.customizer-actions span{color:#aeb3d3;font-size:11px}
.customizer-actions .btn{min-width:150px}
.avatar-card{border-color:#b9a4de66;background:linear-gradient(155deg,#29264f,#111a35)}
.avatar-card.current{border-color:#f1d18e;box-shadow:0 0 0 1px #f1d18e66,0 12px 32px #0005,0 0 24px #caa66d20}
.avatar-card .avatar-preview{border:1px solid #c5b4e455;background:radial-gradient(ellipse at 50% 74%,#baa1ef44,transparent 58%),linear-gradient(145deg,#35335f,#10172e)}
.avatar-card h3{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;letter-spacing:.3px}
.avatar-rarity{padding:4px 8px;border:1px solid #cdb9eb44;border-radius:99px;width:max-content;background:#a18ac522}
@media(max-width:760px){
 .avatar-customizer{padding:16px;border-radius:18px}
 .customizer-title h2{font-size:19px}
 .avatar-settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .customizer-actions{align-items:stretch}
 .customizer-actions .btn{width:100%}
}
@media(max-width:430px){
 .avatar-settings-grid{grid-template-columns:1fr}
 .customizer-gem{width:44px;height:44px;font-size:23px}
}


/* Mobile landscape play mode and first-person camera controls */
.starry-3d-canvas{touch-action:none}
.park-stage-tools{position:absolute;z-index:8;top:15px;right:16px;display:flex;gap:8px;pointer-events:auto}
.plaza-3d .locked{top:62px;right:16px}
.park-tool-button{border:1px solid #ddc58e99;border-radius:99px;padding:8px 13px;background:linear-gradient(145deg,#151a3bdc,#080f2eea);box-shadow:0 8px 24px #0005;color:#f6dfad;font-size:11px;letter-spacing:.4px;backdrop-filter:blur(12px)}
.park-tool-button:hover{border-color:#f8dfab;background:#29254f}
.park-touch-controls{display:none}
.park-rotate-overlay{display:none}
.park-map-svg,.park-map-modal{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
.park-map-svg text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;font-weight:600}
.park-rotate-card h2,.park-social-heading h2,.wardrobe-entry b{font-family:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif}
.plaza-3d:fullscreen,.plaza-3d:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;max-height:none;border:0;border-radius:0;margin:0;padding:0}
.plaza-3d:fullscreen .starry-3d-stage,.plaza-3d:-webkit-full-screen .starry-3d-stage{position:absolute;inset:0}
.plaza-3d:fullscreen .park-minimap,.plaza-3d:-webkit-full-screen .park-minimap{top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 12px)}
.plaza-3d:fullscreen .park-stage-tools,.plaza-3d:-webkit-full-screen .park-stage-tools{top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px)}
@media (pointer:coarse) and (orientation:landscape){
 .plaza-3d{height:min(76vh,690px);min-height:380px}
 .park-touch-controls{display:block;position:absolute;z-index:7;inset:0;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
 .park-joystick-wrap{position:absolute;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
 .park-joystick{width:116px;height:116px;border:1px solid #e4d19a99;border-radius:50%;background:radial-gradient(circle,#d8c9ff18 0 34%,#11183bba 36% 100%);box-shadow:0 8px 28px #03061699,inset 0 0 22px #b99de822;display:grid;place-items:center;touch-action:none}
 .park-joystick:before{content:"";position:absolute;width:72px;height:72px;border:1px solid #d5c7f44d;border-radius:50%}
 .park-joystick-knob{position:relative;width:48px;height:48px;border:1px solid #ffe4a6;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f8e6bc,#9a82c6 68%,#51477f);box-shadow:0 0 20px #bda4f055;pointer-events:none}
 .park-joystick-wrap small{color:#f1deb6;font-size:10px;text-shadow:0 2px 5px #000}
 .park-mobile-actions{position:absolute;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
 .park-action-button{min-width:64px;min-height:54px;padding:9px 13px;border:1px solid #e6ce98aa;border-radius:17px;background:linear-gradient(145deg,#22244edc,#0b1434ed);box-shadow:0 8px 24px #0007;color:#f6e5c5;font-size:12px;font-weight:700;touch-action:none}
 .park-action-button.active{background:linear-gradient(145deg,#9279c8,#4f477f);color:#fff}
 .park-interact-button{background:linear-gradient(145deg,#f3dca7,#b98d55);color:#1c1832;border-color:#fff0c4}
 .park-look-hint{position:absolute;right:0;bottom:70px;white-space:nowrap;padding:5px 9px;border:1px solid #d8cdf344;border-radius:99px;background:#0b1232aa;color:#e4d9f4;font-size:9px;opacity:.85;pointer-events:none}
 .plaza-controls{display:none}
 .plaza-status{left:50%;right:auto;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);max-width:45%;text-align:center}
 .park-stage-tools{top:12px;right:12px}
}
@media (pointer:coarse) and (orientation:portrait){
 .park-rotate-overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#090f2bef,#17183eef);backdrop-filter:blur(13px)}
 .park-rotate-card{width:min(390px,100%);padding:25px 22px;border:1px solid #e5d19c88;border-radius:24px;background:linear-gradient(145deg,#24234f,#101832);text-align:center;box-shadow:0 22px 70px #000a}
 .park-rotate-symbol{width:64px;height:64px;margin:0 auto 12px;border:1px solid #f0d9a4;border-radius:18px;display:grid;place-items:center;color:#f6dfa9;font-size:38px;box-shadow:0 0 28px #b69ade55}
 .park-rotate-card h2{margin:7px 0 9px;color:#f5dfb1;font-size:22px}
 .park-rotate-card p{margin:0 0 18px;color:#c5c4df;font-size:12px;line-height:1.8}
 .park-rotate-card small{display:block;margin-top:12px;color:#aaa8c8;font-size:10px;line-height:1.7}
 .park-rotate-card .btn{width:100%;font-size:12px}
 .park-touch-controls{display:none!important}
}
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
 .plaza-3d{height:100vh;min-height:100vh}
 .park-joystick{width:96px;height:96px}
 .park-joystick:before{width:60px;height:60px}
 .park-joystick-knob{width:42px;height:42px}
 .park-joystick-wrap{bottom:calc(env(safe-area-inset-bottom) + 8px)}
 .park-mobile-actions{bottom:calc(env(safe-area-inset-bottom) + 10px)}
 .park-status{font-size:8px}
}
@media(max-width:760px){
 .park-stage-tools{top:9px;right:9px;gap:5px}
 .park-tool-button{font-size:9px;padding:7px 9px}
 .plaza-topline{right:160px;max-width:calc(100% - 320px)}
}


.map-expand-button{border:1px solid #b9a2df77;border-radius:99px;padding:4px 8px;background:#26234d;color:#f4dda9;font-size:9px;letter-spacing:.3px;cursor:pointer;pointer-events:auto}
.map-expand-button:hover{background:#3a3167;border-color:#f0d49a}
.map-north path{fill:none;stroke:#f4d99b;stroke-width:.8;stroke-linecap:round}
.map-north text{font-size:2.5px;fill:#f4d99b;text-anchor:middle}
.map-visitor{fill:#72d8ed;stroke:#e6fbff;stroke-width:.75;filter:drop-shadow(0 0 2px #5ed2ee)}
.park-map-svg .map-label{font-size:2.5px;font-weight:650}


.park-social-panel{margin:18px 0 24px;padding:20px;border:1px solid #bda9e377;border-radius:23px;background:linear-gradient(145deg,#171c40ee,#0b142eee);box-shadow:0 18px 48px #0005}
.park-social-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.park-social-heading small{font-size:9px;letter-spacing:3px;color:#aaa4d0}
.park-social-heading h2{margin:5px 0;color:#f2dba7;font:600 24px Georgia,"Noto Serif TC",serif}
.park-social-heading p{margin:0;color:#b9b8d2;font-size:12px}
.park-online-count{white-space:nowrap;border:1px solid #d6c38c66;border-radius:99px;padding:8px 12px;color:#f4dca8;background:#3b315022;font-size:11px}
.park-social-layout{display:grid;grid-template-columns:minmax(190px,.78fr) minmax(0,1.6fr);gap:14px}
.park-online-panel,.park-chat-panel{min-width:0;border:1px solid #bdaadd44;border-radius:16px;background:#0e1733a8;padding:14px}
.park-online-panel h3{margin:0 0 12px;color:#dcd3f0;font-size:13px}
#parkPlayers{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
.park-online-person{display:grid;grid-template-columns:25px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 9px;border-radius:11px;background:#ffffff08}
.park-online-orb{grid-row:1/3;width:25px;height:25px;border:1px solid #e6ca8d88;border-radius:50%;display:grid;place-items:center;color:#f1d18e;background:#a18ad222;font-size:12px}
.park-online-person b{color:#eee4ca;font-size:12px;font-weight:650}
.park-online-person small{color:#91c9c0;font-size:9px;margin-top:2px}
.park-chat-panel{display:flex;flex-direction:column;min-height:250px}
.park-chat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid #bdaadd33}
.park-chat-top b{color:#e9d8b0;font-size:12px}
.park-chat-top span{color:#9cb9b8;font-size:10px}
.park-chat-messages{height:190px;overflow:auto;padding:12px 2px;display:flex;flex-direction:column;gap:9px}
.chat-placeholder{padding:14px;color:#9298bb;font-size:11px;text-align:center;line-height:1.7}
.park-chat-message{max-width:min(92%,520px);padding:9px 12px;border:1px solid #c7b4e044;border-radius:13px;background:linear-gradient(145deg,#28254b,#121c39);align-self:flex-start}
.park-chat-message-top{display:flex;align-items:center;gap:12px}
.park-chat-message-top b{font-size:10px;color:#f1d18e}
.park-chat-message-top time{font-size:9px;color:#8189ad}
.park-chat-message p{margin:5px 0 0;color:#e5e4f2;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.park-chat-form{display:flex;gap:8px;padding-top:10px;border-top:1px solid #bdaadd33}
.park-chat-form input{min-width:0;flex:1;border:1px solid #9f8bc766;border-radius:99px;padding:10px 14px;background:#090f25;color:#f4efff;font-size:12px;outline:none}
.park-chat-form input:focus{border-color:#e9d39b}
.park-chat-form input:disabled{opacity:.45;cursor:not-allowed}
.park-chat-form button{flex:0 0 auto}
.park-chat-form button:disabled{opacity:.45;cursor:not-allowed}
.map-visitor{fill:#69d7e9;stroke:#edfbff;stroke-width:.55;filter:drop-shadow(0 0 1.8px #69d7e9)}
@media(max-width:760px){.park-social-panel{padding:14px;border-radius:18px}.park-social-layout{grid-template-columns:1fr}.park-online-panel{padding:12px}.park-chat-panel{min-height:230px}.park-chat-messages{height:170px}.park-social-heading h2{font-size:20px}.park-social-heading p{max-width:240px;font-size:10px}.park-online-count{font-size:9px;padding:7px 9px}}


.map-expand-button{border:1px solid #ddc48c77;border-radius:99px;background:#282347;color:#f4dca8;font-size:8px;padding:3px 7px;letter-spacing:.5px;pointer-events:auto}

.park-map-modal-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.park-map-modal-heading small{color:#aaa4d0;font-size:9px;letter-spacing:3px}
.park-map-modal-heading h2{margin:6px 0 0;color:#f2dba7;font:600 26px Georgia,"Noto Serif TC",serif}
.park-map-svg-large{display:block;width:min(100%,540px);max-height:64vh;margin:10px auto}
.park-map-svg-large .map-label{font-size:2.7px}

function friendlyAuthError(error){const message=String(error?.message||error||"未知錯誤");if(/Invalid login credentials/i.test(message))return "電子郵件或密碼不正確。";if(/Email not confirmed/i.test(message))return "電子郵件尚未驗證，請先查看信箱。";if(/User already registered/i.test(message))return "這個電子郵件已註冊，請直接登入。";if(/Password should be at least/i.test(message))return "密碼長度不足，請使用至少 8 個字元。";if(/rate limit/i.test(message))return "操作次數太頻繁，請稍後再試。";return message}
async function loadCloudPlayer(user,nicknameHint=""){
 if(!sb||!user)throw new Error("目前沒有有效的雲端登入工作階段。");
 const profileFields="user_id,nickname,created_at,avatar_id,owned_avatar_ids,avatar_spent_points,avatar_type,appearance";
 const {data:profile,error:profileError}=await sb.from("sd_profiles").select(profileFields).eq("user_id",user.id).maybeSingle();
 if(profileError)throw profileError;
 let actualProfile=profile;
 if(!actualProfile){
  const candidate=(nicknameHint||user.user_metadata?.nickname||("旅人"+user.id.slice(0,4))).trim().slice(0,16)||("旅人"+user.id.slice(0,4));
  const {data:inserted,error:insertError}=await sb.from("sd_profiles").insert({user_id:user.id,nickname:candidate}).select(profileFields).single();
  if(insertError)throw insertError;
  actualProfile=inserted;
 }
 const [{data:rows,error:recordsError},{data:avatarRows,error:avatarError},{data:isAdmin,error:adminError},{data:discoveryRows,error:discoveryError}]=await Promise.all([
  sb.rpc("sd_my_game_records"),
  sb.rpc("sd_avatar_state"),
  sb.rpc("sd_is_admin"),
  sb.rpc("sd_my_park_discoveries")
 ]);
 if(recordsError)throw recordsError;
 if(avatarError)throw avatarError;
 if(adminError)throw adminError;
 if(discoveryError)throw discoveryError;
 const records=(rows||[]).map(r=>({id:r.record_id,uid:user.id,name:actualProfile.nickname,game:r.game_id,category:r.category,score:Number(r.score)||0,status:r.status,reward:Number(r.reward)||0,time:Date.parse(r.created_at)||Date.now()}));
 const adultPoints=records.filter(r=>r.category==="adult").reduce((sum,r)=>sum+r.reward,0);
 const kidsPoints=records.filter(r=>r.category==="kids").reduce((sum,r)=>sum+r.reward,0);
 const avatarState=Array.isArray(avatarRows)?avatarRows[0]:avatarRows;
 cloudUser=user;
 state.players=[{
  id:user.id,name:actualProfile.nickname,adultPoints,kidsPoints,points:adultPoints,
  created:Date.parse(actualProfile.created_at)||Date.now(),
  avatarId:actualProfile.avatar_id||avatarState?.avatar_id||"wanderer",
  avatarType:actualProfile.avatar_type||"wanderer",
  appearance:Object.assign({},DEFAULT_APPEARANCE,actualProfile.appearance||{}),
  ownedAvatarIds:actualProfile.owned_avatar_ids||avatarState?.owned_avatar_ids||["wanderer"],
  avatarPoints:Number(avatarState?.points_balance)||0,
  parkDiscoveries:(discoveryRows||[]).map(row=>row.discovery_id),
  isAdmin:isAdmin===true
 }];
 state.player=user.id;
 state.records=records.sort((a,b)=>a.time-b.time);
 header();
 home();
}

async function cloudLogin(){
 if(cloudBusy)return;cloudBusy=true;
 const values=authFormValues();
 try{
  if(!sb)throw new Error("Supabase 連線尚未完成，請重新整理頁面。");
  if(!values.email||!values.password)throw new Error("請輸入電子郵件與密碼。");
  const {data,error}=await sb.auth.signInWithPassword({email:values.email,password:values.password});
  if(error)throw error;
  await loadCloudPlayer(data.user,values.nickname);
 }catch(error){authMessage(friendlyAuthError(error),true)}
 finally{cloudBusy=false}
}
async function cloudRegister(){
 if(cloudBusy)return;cloudBusy=true;
 const values=authFormValues();
 try{
  if(!sb)throw new Error("Supabase 連線尚未完成，請重新整理頁面。");
  if(!values.email||!values.password||!values.nickname)throw new Error("註冊時請填寫電子郵件、密碼與旅人暱稱。");
  if(values.password.length<8)throw new Error("密碼至少需要 8 個字元。");
  const {data,error}=await sb.auth.signUp({email:values.email,password:values.password,options:{emailRedirectTo:authRedirectUrl(),data:{nickname:values.nickname}}});
  if(error)throw error;
  if(data.session&&data.user){await loadCloudPlayer(data.user,values.nickname)}
  else{authMessage("註冊申請已送出！請開啟電子郵件中的驗證連結，再回到星夢樂園登入。")}
 }catch(error){authMessage(friendlyAuthError(error),true)}
 finally{cloudBusy=false}
}

async function cloudResetPassword(){

async function bootCloud(){
 if(cloudBootStarted)return;
 cloudBootStarted=true;
 sb=window.SD_SUPABASE||null;
 if(!sb){cloudBootStarted=false;login();authMessage("雲端連線載入失敗："+(window.SD_SUPABASE_ERROR||"請檢查網路後重新整理。"),true);return}
 try{
  const {data,error}=await sb.auth.getSession();
  if(error)throw error;
  if(data.session?.user)await loadCloudPlayer(data.session.user);
  else{cloudUser=null;state.player=null;state.players=[];state.records=[];login()}
  sb.auth.onAuthStateChange((event,session)=>{
   if(event==="SIGNED_OUT"){stopParkSocial();cloudUser=null;state.player=null;state.players=[];state.records=[];login()}
   if(event==="PASSWORD_RECOVERY")showPasswordRecovery();
   if(event==="TOKEN_REFRESHED"&&session?.user&&!cloudUser)loadCloudPlayer(session.user).catch(error=>{login();authMessage("登入狀態已恢復，但載入旅人資料失敗："+friendlyAuthError(error),true)});
  });
 }catch(error){
  cloudBootStarted=false;
  cloudUser=null;state.player=null;state.players=[];state.records=[];
  login();
  authMessage("無法自動恢復登入狀態："+friendlyAuthError(error)+"。可以先按「重新嘗試恢復登入」，不必立即重新輸入密碼。",true);
 }
}

 panel.append(heading,map);if(legend)panel.append(legend);panel.append(note);modal.append(panel);
 modal.addEventListener("click",e=>{if(e.target===modal||e.target.closest("[data-map-close]"))modal.remove()});
 document.addEventListener("keydown",function closeMap(e){if(e.key==="Escape"){modal.remove();document.removeEventListener("keydown",closeMap)}},{once:true});
 document.body.append(modal);
}

window.addEventListener("starry-3d-discovery",event=>{recordParkDiscovery(event.detail)});
window.addEventListener("starry-3d-action",event=>{
 const action=event.detail&&event.detail.action;
 if(action==="ticket-booth")say("星夢入園票亭：歡迎來到星夢樂園！目前開放自由探索；星夢遊戲與星芽探索區可從園區入口開始。");
});

window.addEventListener("starry-3d-ready",()=>{
 const host=document.getElementById("starry-3d");
 if(host)mountCurrentPark(host);
});
window.addEventListener("starry-3d-error",()=>{
 const host=document.getElementById("starry-3d");
 const status=document.getElementById("starry-3d-status");
 if(host){
  host.dataset.status="fallback";
  const fallback=host.querySelector(".starry-3d-fallback");
  if(fallback){
   fallback.hidden=false;
   fallback.innerHTML='<strong>3D 引擎載入失敗</strong><span>目前無法從 CDN 載入 3D 引擎。請確認網路連線後重新整理；下方遊戲入口仍可使用。</span>';
  }
 }
 if(status)status.textContent="3D 引擎載入失敗 · 請檢查網路後重新整理";
});
window.addEventListener("starry-supabase-error",()=>{login();authMessage("無法載入 Supabase 連線元件："+(window.SD_SUPABASE_ERROR||"請確認網路後重新整理。"),true)});
if(cloudMode){restoringSession();if(window.SD_SUPABASE)bootCloud()}else render();
})();
</script></body></html>
