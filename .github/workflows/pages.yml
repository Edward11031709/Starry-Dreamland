name: 星夢樂園檢查與正式發布

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 我已檢查此版本並確認發布到公開網站
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: starry-dreamland-production
  cancel-in-progress: false

jobs:
  validate:
    name: 檢查程式與園區必要元件
    runs-on: ubuntu-latest
    steps:
      - name: 下載 Repository 程式碼
        uses: actions/checkout@v6

      - name: 驗證 JavaScript 語法
        run: |
          node --check js/starry-3d.js
          cp supabase/functions/sd-admin-preview/index.ts /tmp/sd-admin-preview.mjs
          node --check /tmp/sd-admin-preview.mjs
          node --test tests/*.test.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const engine = fs.readFileSync('js/starry-3d.js', 'utf8');
          if (!engine.includes('function buildArcadeStalls(')) {
            throw new Error('Missing required builder: buildArcadeStalls');
          }
          if (!engine.includes('const arcadeStalls=buildArcadeStalls(scene,materials)')) {
            throw new Error('Park environment is not wired to buildArcadeStalls');
          }
          const scripts = [];
          for (const chunk of html.split('<script').slice(1)) {
            const close = chunk.indexOf('</script>');
            const tagEnd = chunk.indexOf('>');
            if (close < 0 || tagEnd < 0) continue;
            const attributes = chunk.slice(0, tagEnd);
            const source = chunk.slice(tagEnd + 1, close);
            if (!attributes.includes('src=') && source.trim()) scripts.push(source);
          }
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((source, index) => new vm.Script(source, { filename: `index.html:inline-script-${index + 1}` }));
          console.log(`Validated js/starry-3d.js and ${scripts.length} inline script(s).`);
          NODE

  deploy:
    name: 管理員確認後發布正式版
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'Edward11031709' && inputs.confirm_release == true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 下載已核准的 main 版本
        uses: actions/checkout@v6

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 記錄本次正式發布版本
        run: |
          cat > release.json <<EOF
          {"commit":"${GITHUB_SHA}","published_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","ref":"${GITHUB_REF_NAME}"}
          EOF

      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 發布正式網站
        id: deployment
        uses: actions/deploy-pages@v4
