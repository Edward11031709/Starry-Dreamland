name: 發布星夢樂園到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: starry-dreamland-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 下載 Repository 程式碼
        uses: actions/checkout@v6

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
